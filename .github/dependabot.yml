version: 2
# Dependabot reads THIS FILE FROM THE DEFAULT BRANCH ONLY, and `target-branch` follows
# manifests/development_policy.json (governance_contract_test pins the two together).
# Updates target main. Pointing the bot at the active release line (as for 0.8.2) made its weekly run
# open pull requests against a frozen release branch -- six on 2026-09-16, during the 0.8.2 cut --
# where nothing can merge and the "no other open PR targets the release branch" gate refuses them.
# A release branch takes dependency changes only as deliberate backports.
updates:
  # Python dependencies declared in pyproject.toml.
  - package-ecosystem: "pip"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      # Bundle routine version-bump PRs into one per week instead of one per dependency, so they
      # don't flood the PR list; a dependency with a major-version bump is excluded so it still gets
      # its own PR and its own review.
      python-dependencies:
        update-types: ["minor", "patch"]

  # GitHub Actions used in .github/workflows/*.yml.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "main"
    schedule:
      interval: "weekly"
