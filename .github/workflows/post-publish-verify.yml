name: Post-publish verify

# Download every public artifact, compare it byte-for-byte with retained pre-publication hashes, then
# install the already-verified wheel. Behavior smoke alone cannot establish artifact identity.
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Published version to verify from PyPI (e.g. 0.8.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify:
    name: verified public artifacts / ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - id: release
        name: Validate the requested version
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
        run: |
          python -c 'import os,re,sys; v=os.environ["REQUESTED_VERSION"]; sys.exit(0 if re.fullmatch(r"[0-9]+\.[0-9]+\.[0-9]+", v) else 1)'
          printf 'version=%s\n' "$REQUESTED_VERSION" >> "$GITHUB_OUTPUT"
      - name: Download retained hashes and every public-index artifact
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          mkdir -p retained public-artifacts
          gh release download "v$VERSION" --pattern SHA256SUMS --dir retained
          python -m pip download --no-deps --only-binary=:all: --dest public-artifacts "mixle==$VERSION"
          python -m pip download --no-deps --no-binary=:all: --dest public-artifacts "mixle==$VERSION"
          python scripts/verify_published_artifacts.py \
            --directory public-artifacts \
            --sums retained/SHA256SUMS
      - name: Install the verified public wheel
        run: |
          # The digests were checked in the previous step, so this installs bytes that have already
          # been matched against the retained SHA256SUMS -- hash first, install second.
          #
          # If the install fails anyway, the environment is DESTROYED rather than reused. pip writes
          # the .dist-info last, so an install that dies partway leaves the files it already
          # unpacked importable with no metadata behind them, answering mixle.__version__ as
          # "0+unknown" -- a fragment of a package that a later step would happily import and smoke
          # test (SYS-06). Installing over that state does not fix it either: whatever orphans the
          # retry does not overwrite survive. A fresh venv is the only clean recovery.
          set -euo pipefail
          rm -rf /tmp/verify-env
          python -m venv /tmp/verify-env
          /tmp/verify-env/bin/python -m pip install --upgrade pip
          if ! /tmp/verify-env/bin/python -m pip install public-artifacts/*.whl; then
            rm -rf /tmp/verify-env
            echo "::error::wheel install failed; removed the partially populated environment"
            exit 1
          fi
      - name: Version metadata and public behavior smoke
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          /tmp/verify-env/bin/python -c 'import os,mixle; assert mixle.__version__ == os.environ["VERSION"]'
          /tmp/verify-env/bin/python - <<'PY'
          import numpy as np
          from mixle.inference import optimize
          from mixle.stats import GaussianEstimator

          data = np.random.RandomState(0).normal(2.0, 1.5, 500).tolist()
          model = optimize(data, GaussianEstimator(), max_its=20, out=None)
          assert np.isfinite(np.mean([model.log_density(x) for x in data]))
          PY
          /tmp/verify-env/bin/python -m pip check
      - name: Retain public-index identity receipt
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          python -c 'import hashlib,json,os,pathlib; files=sorted(pathlib.Path("public-artifacts").iterdir()); pathlib.Path("public-index-receipt.json").write_text(json.dumps({"artifact":"mixle.public_index_identity/v1","version":os.environ["VERSION"],"files":{p.name:hashlib.sha256(p.read_bytes()).hexdigest() for p in files},"passed":True},sort_keys=True)+"\n")'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: public-index-identity-${{ matrix.os }}-py${{ matrix.python-version }}
          path: public-index-receipt.json
          if-no-files-found: error
          retention-days: 90
