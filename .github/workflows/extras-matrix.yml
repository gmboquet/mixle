name: Extras resolver matrix

# Worklist P2.3: install every documented extra (and [all]) in ISOLATION in a fresh environment, and prove
# that (a) it resolves and installs, (b) the dependency graph stays consistent (`pip check` -- catches an
# extra that silently downgrades or uninstalls a required package), and (c) mixle still imports. Heavy, so
# it runs on manual dispatch and the weekly schedule, not on every PR. `fail-fast: false` keeps each extra
# independent, so the run is a self-diagnosing matrix: one extra that cannot install on the runner is a
# visible red cell, not a masked failure. macOS/arm64 and other OS/arch combinations are verified in the
# release owner's environment and recorded in the release checklist; this job pins the Linux x86_64 baseline.
on:
  workflow_dispatch:
  push:
    branches: [release/0.8.0]
  pull_request:
  schedule:
    - cron: "23 9 * * 1"

permissions:
  contents: read

jobs:
  extra:
    name: "install .[${{ matrix.extra }}]"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        extra:
          - numba
          - torch
          - jax
          - pandas
          - arrow
          - sql
          - mongo
          - hadoop
          - arrays
          - grammar
          - gmpy2
          - highprec
          - spark
          - dask
          - ray
          - lightning
          - mpi
          - umap
          - sympy
          - sage
          - scientist
          - kernels
          - examples
          - all
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      # A few extras build native code and need system headers. Install them only for the extras that do.
      - name: System build dependencies
        run: |
          if [ "${{ matrix.extra }}" = "mpi" ]; then
            # apt on hosted runners occasionally hangs on a mirror; unbounded, that hang consumed
            # this job's whole 30-minute timeout and failed the publication gate three times.
            # Every call is bounded and retried.
            apt_bounded() { for attempt in 1 2 3; do if timeout 240 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 "$@"; then return 0; fi; echo "apt-get $* attempt $attempt failed or timed out; retrying" >&2; sleep 10; done; return 1; }
            apt_bounded update && apt_bounded install -y libopenmpi-dev openmpi-bin
          fi
      # `packaging` parses the requirement strings (markers included) for the two helper scripts.
      # It lives in its own venv on purpose: both the candidate and the floor environments have their
      # full `pip freeze --all` recorded as release evidence, so installing a tooling dependency into
      # either would put `packaging` in the recorded graph of a profile that does not declare it.
      - name: Profile tooling (isolated from every recorded environment)
        run: |
          python -m venv "$RUNNER_TEMP/profile-tool"
          "$RUNNER_TEMP/profile-tool/bin/python" -m pip install --upgrade pip "packaging>=24,<26"
      - name: Install .[${{ matrix.extra }}] in isolation
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[${{ matrix.extra }}]"
      - name: pip check (no extra downgraded or broke a required dependency)
        run: python -m pip check
      - name: mixle still imports
        run: |
          python -c "import mixle; print('mixle', mixle.__version__, 'imports with [${{ matrix.extra }}]')"
          MODULES="$("$RUNNER_TEMP/profile-tool/bin/python" scripts/verify_extra_profile.py \
            --profile "${{ matrix.extra }}" --print-modules)"
          python scripts/verify_extra_profile.py --profile "${{ matrix.extra }}" --modules "$MODULES"
      - name: Record exact candidate and resolved graph
        env:
          PROFILE: ${{ matrix.extra }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          python scripts/environment_receipt.py record \
            --profile "$PROFILE" \
            --candidate-sha "$CANDIDATE_SHA" \
            --out "extra-receipt-$PROFILE.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: extra-receipt-${{ matrix.extra }}
          path: extra-receipt-${{ matrix.extra }}.json
          if-no-files-found: error
          retention-days: 90
      - name: Generate and install exact declared floors
        env:
          PROFILE: ${{ matrix.extra }}
        run: |
          # Run through the tool venv: this script imports `packaging`, and the ambient interpreter
          # only ever had mixle[<extra>] installed -- mixle does not depend on packaging, and pip
          # vendors its copy privately rather than exposing it. Every profile died here on
          # `ModuleNotFoundError: No module named 'packaging'` before generating a single constraint.
          "$RUNNER_TEMP/profile-tool/bin/python" scripts/generate_extra_floor_constraints.py \
            --profile "$PROFILE" --out "floor-$PROFILE.txt"
          python -m venv "$RUNNER_TEMP/floor-env"
          "$RUNNER_TEMP/floor-env/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/floor-env/bin/python" -m pip install \
            -c "floor-$PROFILE.txt" ".[${{ matrix.extra }}]"
          "$RUNNER_TEMP/floor-env/bin/python" -m pip check
          FLOOR_MODULES="$("$RUNNER_TEMP/profile-tool/bin/python" scripts/verify_extra_profile.py \
            --profile "$PROFILE" --print-modules)"
          "$RUNNER_TEMP/floor-env/bin/python" scripts/verify_extra_profile.py \
            --profile "$PROFILE" --modules "$FLOOR_MODULES"
      - name: Record exact floor dependency graph
        env:
          PROFILE: ${{ matrix.extra }}
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          "$RUNNER_TEMP/floor-env/bin/python" scripts/environment_receipt.py record \
            --profile "$PROFILE" \
            --candidate-sha "$CANDIDATE_SHA" \
            --out "extra-floor-receipt-$PROFILE.json"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: extra-floor-receipt-${{ matrix.extra }}
          path: extra-floor-receipt-${{ matrix.extra }}.json
          if-no-files-found: error
          retention-days: 90

  release-evidence:
    name: extras matrix / exact candidate
    if: always()
    needs: extra
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: extra-receipt-*
          path: extra-receipts
          merge-multiple: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: extra-floor-receipt-*
          path: extra-floor-receipts
          merge-multiple: true
      - name: Require every profile on this exact commit
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          test "${{ needs.extra.result }}" = "success"
          python scripts/environment_receipt.py verify \
            --directory extra-receipts \
            --policy release-checklists/0.8.0-extra-profiles.json \
            --candidate-sha "$CANDIDATE_SHA" \
            --out extra-profile-set-receipt.json
          python scripts/environment_receipt.py verify \
            --directory extra-floor-receipts \
            --policy release-checklists/0.8.0-extra-profiles.json \
            --candidate-sha "$CANDIDATE_SHA" \
            --out extra-floor-profile-set-receipt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: extra-profile-set-${{ github.sha }}
          path: |
            extra-profile-set-receipt.json
            extra-floor-profile-set-receipt.json
          if-no-files-found: error
          retention-days: 90
