name: Docs

# Build moving main-branch documentation once, authenticate immutable documentation archives attached
# to public releases, assemble them into one versioned site, and deploy it to GitHub Pages. Historical
# releases are never rebuilt with today's dependencies.
#
# One-time setup (repo Settings > Pages): set the source to "GitHub Actions". This workflow already has the
# permissions the deploy step needs.
#
# Pull requests and active-release pushes run revision-check below: a single-revision `sphinx-build -W`, no
# versioning and no deploy. That is what would have caught the docname collision fixed alongside this
# job (docs/development.md + docs/development.rst, and docs/operations.md + docs/operations.rst, both
# registered source suffixes resolving to the same docname): the push-to-main build job never treats
# warnings as errors, so "multiple files found for the document" silently passed through it for as
# long as this repo has built docs.

on:
  push:
    branches: [main, release/0.8.0]
  release:
    types: [published]
  pull_request:
    paths:
      - "docs/**"
      - "mixle/**"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

# Least-privilege token plus the OIDC + pages permissions the deploy-pages action requires. revision-check
# needs none of this; it only reads the checkout, so it runs fine under the same block.
permissions:
  contents: read

# One Pages deployment at a time; let an in-progress deploy finish rather than cancelling it. This
# only ever applies to push/workflow_dispatch runs (build/deploy below skip pull_request), so PRs
# never queue behind a Pages deploy or each other here -- see revision-check's own concurrency group.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Assemble versioned HTML
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The full multi-version build + Pages upload is for push/workflow_dispatch only; PRs get the
    # faster single-revision revision-check job instead.
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: main
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Build development documentation
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"
          python -m sphinx -b html -W --keep-going docs "$RUNNER_TEMP/docs-main"
      - name: Download immutable public release documentation
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/docs-archives"
          gh release list --repo "$REPOSITORY" --limit 100 \
            --json tagName,isDraft,isPrerelease \
            --jq '.[] | select(.isDraft == false and .isPrerelease == false) | .tagName' |
          while read -r tag; do
            case "$tag" in
              v[0-9]*.[0-9]*.[0-9]*)
                archive="mixle-docs-$tag.tar.gz"
                digest="$archive.sha256"
                assets="$(gh release view "$tag" --repo "$REPOSITORY" --json assets --jq '.assets[].name')"
                if printf '%s\n' "$assets" | grep -Fxq "$archive"; then
                  printf '%s\n' "$assets" | grep -Fxq "$digest"
                  gh release download "$tag" --repo "$REPOSITORY" \
                    --pattern "$archive" --pattern "$digest" \
                    --dir "$RUNNER_TEMP/docs-archives"
                elif printf '%s\n' "$assets" | grep -Fxq "$digest"; then
                  echo "$tag has a documentation digest without its archive" >&2
                  exit 1
                fi
                ;;
            esac
          done
      - name: Authenticate and assemble site
        run: |
          python scripts/assemble_docs_site.py \
            --development "$RUNNER_TEMP/docs-main" \
            --archives "$RUNNER_TEMP/docs-archives" \
            --output "$RUNNER_TEMP/docs-site"
          python scripts/verify_docs_site.py --site "$RUNNER_TEMP/docs-site"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: ${{ runner.temp }}/docs-site

  deploy:
    name: Deploy to Pages
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || github.event_name == 'release'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  revision-check:
    name: Revision check (single-revision, warnings as errors)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/release/0.8.0'
    # Independent group so PR checks never queue behind a Pages deploy or behind each other; only
    # the latest push on a given PR ref needs to run.
    concurrency:
      group: docs-revision-check-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package with docs extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[docs]"
      - name: sphinx-build -W (current revision only, no polyversion, no deploy)
        run: python -m sphinx -b html -W --keep-going docs "$RUNNER_TEMP/docs-build-check"
