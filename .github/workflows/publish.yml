name: Publish

# Publication is deliberately two phase and manually dispatched from the signed candidate tag:
#
#   prepare  - verify the exact release-branch tip and required checks, build/attest immutable
#              artifacts, retain the workflow artifact, and create a non-public draft release.
#   promote  - download that exact prepare-run artifact, re-verify every digest, publish the
#              already-validated files to PyPI, and only then make the GitHub Release public.
#
# A failed build can therefore never follow a public GitHub Release. A failure after the idempotent
# PyPI upload leaves a recoverable draft; rerunning promote verifies the same bytes and completes
# the final public transition.

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "prepare artifacts, rehearse them on TestPyPI, or promote them"
        required: true
        type: choice
        options: [prepare, testpypi, promote]
      tag:
        description: "Signed annotated candidate tag (for example v0.8.1)"
        required: true
        type: string
      prepare_run_id:
        description: "Successful prepare workflow run ID (required for testpypi/promote)"
        required: false
        type: string
      testpypi_run_id:
        description: "Successful TestPyPI rehearsal run ID (promote: this or manual_rehearsal_asset, never both)"
        required: false
        type: string
      manual_rehearsal_asset:
        description: "promote only: name of the manual rehearsal record attached to the draft release (testpypi-rehearsal-manual-<sha8>.json), for a version an earlier candidate already put on TestPyPI"
        required: false
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify-candidate:
    name: Verify immutable release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      # the check-evidence record is attested through this workflow's OIDC identity (SYS5-01)
      id-token: write
      attestations: write
    outputs:
      candidate-sha: ${{ steps.candidate.outputs.sha }}
      candidate-tag: ${{ steps.candidate.outputs.tag }}
      candidate-version: ${{ steps.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - id: candidate
        name: Bind tag, version, ancestry, signature, and hosted evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
          PHASE: ${{ inputs.phase }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
          TESTPYPI_RUN_ID: ${{ inputs.testpypi_run_id }}
          MANUAL_REHEARSAL_ASSET: ${{ inputs.manual_rehearsal_asset }}
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          TAG="$RELEASE_TAG"
          test "$TAG" = "v$VERSION"
          test "$(git cat-file -t "refs/tags/$TAG")" = "tag"

          TAG_OBJECT_SHA="$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)"
          test "$(gh api "repos/$REPOSITORY/git/tags/$TAG_OBJECT_SHA" --jq .verification.verified)" = "true"
          SHA="$(gh api "repos/$REPOSITORY/git/tags/$TAG_OBJECT_SHA" --jq .object.sha)"
          test "$SHA" = "$(git rev-list -n 1 "refs/tags/$TAG")"
          test "$EVENT_SHA" = "$SHA"

          RELEASE_SHA="$(gh api "repos/$REPOSITORY/branches/release/0.8.1" --jq .commit.sha)"
          test "$SHA" = "$RELEASE_SHA"

          if [ "$PHASE" = "promote" ]; then
            test -n "$PREPARE_RUN_ID"
            case "$PREPARE_RUN_ID" in *[!0-9]*) exit 1;; esac
            # Exactly one rehearsal form: the automated run, or -- only when an earlier candidate of
            # this same version already occupies TestPyPI, so no later candidate's bytes can ever be
            # rehearsed there -- the manual record attached to the draft release (D-0211). The
            # promote job verifies the record and re-derives its smoke itself.
            if [ -n "$TESTPYPI_RUN_ID" ]; then
              test -z "$MANUAL_REHEARSAL_ASSET"
              case "$TESTPYPI_RUN_ID" in *[!0-9]*) exit 1;; esac
            else
              test -n "$MANUAL_REHEARSAL_ASSET"
              case "$MANUAL_REHEARSAL_ASSET" in testpypi-rehearsal-manual-[0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f][0-9a-f].json) ;; *) exit 1;; esac
            fi
          elif [ "$PHASE" = "testpypi" ]; then
            test -n "$PREPARE_RUN_ID"
            test -z "$TESTPYPI_RUN_ID"
            test -z "$MANUAL_REHEARSAL_ASSET"
            case "$PREPARE_RUN_ID" in *[!0-9]*) exit 1;; esac
          else
            test -z "$PREPARE_RUN_ID"
            test -z "$TESTPYPI_RUN_ID"
            test -z "$MANUAL_REHEARSAL_ASSET"
          fi

          python scripts/verify_license_provenance.py --require-approved
          python scripts/check_release_document_state.py --version "$VERSION"
          python scripts/verify_release_checklist.py \
            --checklist release-checklists/0.8.1.md \
            --receipts release-checklists/0.8.1-receipts \
            --candidate-sha "$SHA" \
            --require-final
          # every page: the generator requires the runs to add up to GitHub's total_count, because
          # "latest run per name" is meaningless over a truncated first page
          mkdir -p "$RUNNER_TEMP/approval"
          gh api --paginate --slurp "repos/$REPOSITORY/commits/$SHA/check-runs?per_page=100" > "$RUNNER_TEMP/approval/check-runs.json"
          # The record commits to the digest of this exact payload and is retained beside it, so
          # any consumer can re-derive the selection; the attestation below is what makes it
          # approval evidence rather than a well-shaped file (SYS5-01).
          python scripts/verify_required_checks.py \
            --required .github/release-required-checks.txt \
            --input "$RUNNER_TEMP/approval/check-runs.json" \
            --sha "$SHA" \
            --repository "$REPOSITORY" > "$RUNNER_TEMP/approval/release-check-evidence.json"

          printf 'sha=%s\n' "$SHA" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
      - id: attest
        name: Attest the check-evidence record through this workflow's identity
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/approval/release-check-evidence.json
          predicate-type: https://github.com/gmboquet/mixle/release-check-evidence/v1
          predicate: '{"commit": "${{ steps.candidate.outputs.sha }}", "phase": "${{ inputs.phase }}"}'
          show-summary: false
      - name: Retain the bundle and verify it exactly as the receipt resolver will
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ steps.candidate.outputs.sha }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" "$RUNNER_TEMP/approval/release-check-evidence.sigstore.json"
          # the same binding the resolver applies: identity regex (repository + workflow), GitHub's
          # OIDC issuer, the candidate commit, this predicate type; Sigstore's public-good root via
          # gh -- never a root shipped beside the record
          gh attestation verify "$RUNNER_TEMP/approval/release-check-evidence.json" \
            --bundle "$RUNNER_TEMP/approval/release-check-evidence.sigstore.json" \
            --repo "$REPOSITORY" \
            --cert-identity-regex "^https://github\\.com/$REPOSITORY/\\.github/workflows/publish\\.yml@" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            --source-digest "$SHA" \
            --predicate-type https://github.com/gmboquet/mixle/release-check-evidence/v1 \
            --deny-self-hosted-runners \
            --format json > /dev/null
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-approval-${{ steps.candidate.outputs.sha }}-${{ inputs.phase }}
          path: ${{ runner.temp }}/approval/
          if-no-files-found: error
          retention-days: 90

  build:
    name: Prepare exact candidate and draft release
    if: inputs.phase == 'prepare'
    needs: verify-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.verify-candidate.outputs.candidate-sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-approval-${{ needs.verify-candidate.outputs.candidate-sha }}-prepare
          path: metadata
      - name: Build exact candidate
        env:
          CANDIDATE_SHA: ${{ needs.verify-candidate.outputs.candidate-sha }}
          CANDIDATE_VERSION: ${{ needs.verify-candidate.outputs.candidate-version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          python -m pip install --upgrade "pip==26.1.2"
          python -m pip install -r release-checklists/0.8.1-build-requirements.txt
          python -m pip install -r release-checklists/0.8.1-repro-requirements.txt
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct HEAD)"
          export MIXLE_SOURCE_COMMIT="$CANDIDATE_SHA"
          export MIXLE_SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          export MIXLE_SOURCE_DIRTY=false
          mkdir source-a source-b dist-a dist-b dist
          git archive HEAD | tar -x -C source-a
          git archive HEAD | tar -x -C source-b
          python scripts/build_environment_receipt.py \
            --requirements release-checklists/0.8.1-build-requirements.txt \
            --out metadata/build-environment.json
          (cd source-a && python -m build --no-isolation --outdir ../dist-a)
          (cd source-b && python -m build --no-isolation --outdir ../dist-b)
          python scripts/normalize_sdist.py dist-a/*.tar.gz "$SOURCE_DATE_EPOCH"
          python scripts/normalize_sdist.py dist-b/*.tar.gz "$SOURCE_DATE_EPOCH"
          python scripts/verify_reproducible_builds.py \
            --left dist-a --right dist-b --out metadata/reproducible-builds.json
          cp dist-a/* dist/
          twine check dist/*
          python -m pip install -e ".[docs]"
          python -m sphinx -b html -W --keep-going docs "$RUNNER_TEMP/docs-html"
          python scripts/package_docs_archive.py \
            --source "$RUNNER_TEMP/docs-html" \
            --output "docs-dist/mixle-docs-v$CANDIDATE_VERSION.tar.gz" \
            --version "$CANDIDATE_VERSION" \
            --commit "$CANDIDATE_SHA" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"
      - name: Record candidate and artifact digests
        env:
          CANDIDATE_SHA: ${{ needs.verify-candidate.outputs.candidate-sha }}
          CANDIDATE_TAG: ${{ needs.verify-candidate.outputs.candidate-tag }}
          CANDIDATE_VERSION: ${{ needs.verify-candidate.outputs.candidate-version }}
        run: |
          set -euo pipefail
          for artifact in dist/*; do
            python scripts/release_metadata.py "$artifact" \
              --out "metadata/$(basename "$artifact").json"
          done
          (cd dist && sha256sum * > ../metadata/SHA256SUMS)
          python -m venv "$RUNNER_TEMP/sbom-artifact-env"
          # pip-audit audits everything under this env's site-packages, which includes the pip that
          # `python -m venv` bootstraps (25.0.1 on the runner, seven published advisories); the build
          # env pins its pip but this one never did, so the audit failed on tooling with zero findings
          # in the artifact. Pin an advisory-free pip here before installing the wheel.
          "$RUNNER_TEMP/sbom-artifact-env/bin/python" -m pip install --upgrade "pip==26.2.1"
          "$RUNNER_TEMP/sbom-artifact-env/bin/python" -m pip install dist/*.whl
          SITE=$("$RUNNER_TEMP/sbom-artifact-env/bin/python" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
          python -m venv "$RUNNER_TEMP/sbom-tool-env"
          "$RUNNER_TEMP/sbom-tool-env/bin/python" -m pip install pip-audit
          python scripts/verify_vulnerability_waivers.py \
            --input .github/pip-audit-waivers.json --profile base \
            --args-out metadata/waiver-args.txt \
            --receipt metadata/accepted-waivers.json
          mapfile -t WAIVERS < metadata/waiver-args.txt
          "$RUNNER_TEMP/sbom-tool-env/bin/pip-audit" \
            --path "$SITE" "${WAIVERS[@]}" \
            --format cyclonedx-json -o metadata/raw-sbom.json
          python scripts/bind_sbom.py \
            --cyclonedx metadata/raw-sbom.json \
            --wheel-metadata metadata/mixle-0.8.1-py3-none-any.whl.json \
            --candidate-sha "$CANDIDATE_SHA" \
            --waivers metadata/accepted-waivers.json \
            --out metadata/sbom.json
          rm metadata/raw-sbom.json metadata/waiver-args.txt
          # The candidate record names the source commit AND tree; the receipt resolver compares
          # both against the executing artifact's embedded provenance. One producer, shared with
          # the tests, so the workflow cannot write a shape the resolver does not read.
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          python scripts/release_candidate_record.py \
            --commit "$CANDIDATE_SHA" \
            --tree "$(git rev-parse 'HEAD^{tree}')" \
            --tag "$CANDIDATE_TAG" \
            --version "$CANDIDATE_VERSION" \
            --workflow-run "$GITHUB_RUN_ID" \
            --out metadata/release-candidate.json
          # Produce the entry receipts against the CANDIDATE ARTIFACT, not the editable checkout,
          # and with the retained records available. Run from the ambient interpreter with neither,
          # every receipt was "unbound" -- and promotion then rejected exactly those receipts for
          # not being "verified", so the workflow could not publish anything it produced. The
          # records written earlier in this step (release-candidate.json, SHA256SUMS, the wheel
          # metadata record) are what the runner cross-binds the executing artifact against.
          python -m venv "$RUNNER_TEMP/repro-env"
          "$RUNNER_TEMP/repro-env/bin/python" -m pip install --quiet --upgrade pip
          "$RUNNER_TEMP/repro-env/bin/python" -m pip install --quiet dist/*.whl
          # the bundle pins the reproduction environment exactly; byte-identical stdout is only
          # meaningful under the arithmetic that produced it.
          python -c 'import json,pathlib;d=json.loads(pathlib.Path("release-checklists/0.8.1-repro-environment.json").read_text());print("\n".join(f"{k}=={v}" for k,v in d["dependencies"].items()))' > "$RUNNER_TEMP/repro-pins.txt"
          "$RUNNER_TEMP/repro-env/bin/python" -m pip install --quiet -r "$RUNNER_TEMP/repro-pins.txt"
          # Each receipt is written OUTSIDE the records root and moved in only after the runner
          # exits successfully. Redirecting stdout straight to metadata/reproduction-$entry.json
          # made the shell create that (empty) file BEFORE the runner resolved
          # metadata/reproduction-*.json, so the runner read its own empty output as a malformed
          # prior receipt and deterministically emitted "unbound" -- and promotion then rejected
          # every receipt this step produced (SYS3-04). Earlier receipts stay fully validated.
          for entry in gallery-univariate gallery-structured production-provenance scaling-backend; do
            "$RUNNER_TEMP/repro-env/bin/python" scripts/run_repro_entry.py \
              --entry "$entry" --records-root . > "$RUNNER_TEMP/reproduction-$entry.json"
            mv "$RUNNER_TEMP/reproduction-$entry.json" "metadata/reproduction-$entry.json"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate-${{ needs.verify-candidate.outputs.candidate-sha }}
          path: |
            dist/
            docs-dist/
            metadata/
          if-no-files-found: error
          retention-days: 90
      - name: Create or update a non-public draft release
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ needs.verify-candidate.outputs.candidate-tag }}
        run: |
          set -euo pipefail
          if gh release view "$CANDIDATE_TAG" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$CANDIDATE_TAG" --json isDraft --jq .isDraft)" = "true"
          else
            gh release create "$CANDIDATE_TAG" --verify-tag --draft \
              --title "mixle ${{ needs.verify-candidate.outputs.candidate-version }}" \
              --generate-notes
          fi
          gh release upload "$CANDIDATE_TAG" dist/* docs-dist/* metadata/* --clobber

  testpypi:
    name: Rehearse exact candidate on TestPyPI
    if: inputs.phase == 'testpypi'
    needs: verify-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: testpypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.verify-candidate.outputs.candidate-sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate-${{ needs.verify-candidate.outputs.candidate-sha }}
          path: candidate
          run-id: ${{ inputs.prepare_run_id }}
          github-token: ${{ github.token }}
      - name: Verify the prepared TestPyPI candidate
        env:
          CANDIDATE_SHA: ${{ needs.verify-candidate.outputs.candidate-sha }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
        run: |
          set -euo pipefail
          test "$(python -c 'import json; print(json.load(open("candidate/metadata/release-candidate.json"))["commit"])')" = "$CANDIDATE_SHA"
          test "$(python -c 'import json; print(json.load(open("candidate/metadata/release-candidate.json"))["workflow_run"])')" = "$PREPARE_RUN_ID"
          (cd candidate/dist && sha256sum -c ../metadata/SHA256SUMS)
      - name: Upload the already-verified files to TestPyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: candidate/dist/
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
      - name: Download, verify, install, and smoke the TestPyPI bytes
        env:
          VERSION: ${{ needs.verify-candidate.outputs.candidate-version }}
          CANDIDATE_SHA: ${{ needs.verify-candidate.outputs.candidate-sha }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            rm -rf testpypi-artifacts
            mkdir testpypi-artifacts
            # The wheel comes through pip. The sdist must NOT: `pip download --no-binary` prepares
            # metadata by building the sdist, which installs the pinned build backend
            # (setuptools==<exact>) from the only index it was given, and TestPyPI does not carry
            # it -- the 0.8.0 rehearsal (run 34020725246) failed there after the upload had already
            # succeeded, and the published bytes had to be verified by hand. Fetch the sdist by the
            # exact URL TestPyPI's JSON API reports; the digest check below is what verifies it.
            if python -m pip download --index-url https://test.pypi.org/simple \
                 --no-deps --only-binary=:all: --dest testpypi-artifacts "mixle==$VERSION" &&
               python - "$VERSION" <<'EOF'
          import json, sys, urllib.request
          version = sys.argv[1]
          with urllib.request.urlopen(f"https://test.pypi.org/pypi/mixle/{version}/json", timeout=60) as fh:
              files = json.load(fh)["urls"]
          sdists = [f for f in files if f["packagetype"] == "sdist"]
          if len(sdists) != 1:
              raise SystemExit(f"expected exactly one sdist on TestPyPI for {version}, found {len(sdists)}")
          urllib.request.urlretrieve(sdists[0]["url"], "testpypi-artifacts/" + sdists[0]["filename"])
          EOF
            then
              break
            fi
            # TestPyPI's simple index lists a fresh upload only after propagation; the 0.8.1
            # rehearsal (run 34093207858) uploaded successfully and then failed here after six
            # tries over one minute, and the re-dispatch passed once the index had caught up.
            test "$attempt" -lt 40
            sleep 15
          done
          python scripts/verify_published_artifacts.py \
            --directory testpypi-artifacts \
            --sums candidate/metadata/SHA256SUMS
          python -m venv "$RUNNER_TEMP/testpypi-env"
          "$RUNNER_TEMP/testpypi-env/bin/python" -m pip install testpypi-artifacts/*.whl
          "$RUNNER_TEMP/testpypi-env/bin/python" scripts/import_sweep.py
          python -c 'import hashlib,json,os,pathlib; sums=pathlib.Path("candidate/metadata/SHA256SUMS"); pathlib.Path("testpypi-rehearsal.json").write_text(json.dumps({"artifact":"mixle.testpypi_rehearsal/v1","candidate_commit":os.environ["CANDIDATE_SHA"],"prepare_run":int(os.environ["PREPARE_RUN_ID"]),"sums_sha256":hashlib.sha256(sums.read_bytes()).hexdigest(),"passed":True},sort_keys=True)+"\n")'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: testpypi-rehearsal-${{ needs.verify-candidate.outputs.candidate-sha }}
          path: testpypi-rehearsal.json
          if-no-files-found: error
          retention-days: 90

  promote:
    name: Promote prepared artifacts and publish release
    if: inputs.phase == 'promote'
    needs: verify-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.verify-candidate.outputs.candidate-sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate-${{ needs.verify-candidate.outputs.candidate-sha }}
          path: candidate
          run-id: ${{ inputs.prepare_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-approval-${{ needs.verify-candidate.outputs.candidate-sha }}-promote
          path: promotion
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.testpypi_run_id != ''
        with:
          name: testpypi-rehearsal-${{ needs.verify-candidate.outputs.candidate-sha }}
          path: testpypi
          run-id: ${{ inputs.testpypi_run_id }}
          github-token: ${{ github.token }}
      - name: Fetch the manual rehearsal record from the draft release
        if: inputs.testpypi_run_id == ''
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ needs.verify-candidate.outputs.candidate-tag }}
          MANUAL_REHEARSAL_ASSET: ${{ inputs.manual_rehearsal_asset }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          # only the repository owner's upload counts as the release owner's attestation
          # A draft release is not served by the by-tag endpoint (404 for drafts; the 0.8.1 promotes
          # 34105506825, 34106234141 and 34107126999 failed here), so resolve it through the list.
          UPLOADER="$(gh api --paginate "repos/$REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$CANDIDATE_TAG\") | .assets[] | select(.name == \"$MANUAL_REHEARSAL_ASSET\") | .uploader.login")"
          test "$UPLOADER" = "$REPOSITORY_OWNER"
          mkdir -p testpypi
          gh release download "$CANDIDATE_TAG" --repo "$REPOSITORY" --pattern "$MANUAL_REHEARSAL_ASSET" --dir testpypi
      - name: Re-verify immutable prepared evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.verify-candidate.outputs.candidate-sha }}
          CANDIDATE_TAG: ${{ needs.verify-candidate.outputs.candidate-tag }}
          VERSION: ${{ needs.verify-candidate.outputs.candidate-version }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
          TESTPYPI_RUN_ID: ${{ inputs.testpypi_run_id }}
          MANUAL_REHEARSAL_ASSET: ${{ inputs.manual_rehearsal_asset }}
          REPOSITORY: ${{ github.repository }}
          REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: |
          set -euo pipefail
          test "$(gh release view "$CANDIDATE_TAG" --json isDraft --jq .isDraft)" = "true"
          test "$(python -c 'import json; print(json.load(open("candidate/metadata/release-candidate.json"))["commit"])')" = "$CANDIDATE_SHA"
          test "$(python -c 'import json; print(json.load(open("candidate/metadata/release-candidate.json"))["workflow_run"])')" = "$PREPARE_RUN_ID"
          if [ -n "$TESTPYPI_RUN_ID" ]; then
            python scripts/verify_rehearsal_record.py \
              --record testpypi/testpypi-rehearsal.json \
              --candidate-sha "$CANDIDATE_SHA" --prepare-run "$PREPARE_RUN_ID" \
              --sums candidate/metadata/SHA256SUMS
          else
            python scripts/verify_rehearsal_record.py \
              --record "testpypi/$MANUAL_REHEARSAL_ASSET" --manual \
              --candidate-sha "$CANDIDATE_SHA" --prepare-run "$PREPARE_RUN_ID" \
              --sums candidate/metadata/SHA256SUMS \
              --version "$VERSION" --uploader "$REPOSITORY_OWNER"
            # the record's smoke is re-derived here, not trusted: a clean install of the prepared
            # wheel and the same import sweep the automated rehearsal runs
            python -m venv "$RUNNER_TEMP/promote-smoke"
            "$RUNNER_TEMP/promote-smoke/bin/python" -m pip install candidate/dist/*.whl
            "$RUNNER_TEMP/promote-smoke/bin/python" scripts/import_sweep.py
            cp "testpypi/$MANUAL_REHEARSAL_ASSET" candidate/metadata/testpypi-rehearsal-manual.json
          fi
          cp promotion/release-check-evidence.json candidate/metadata/promotion-check-evidence.json
          (cd candidate/dist && sha256sum -c ../metadata/SHA256SUMS)
          SECURITY_RUN="$(python -c 'import json, re; u=json.load(open("promotion/release-check-evidence.json"))["checks"]["pip-audit (all runtime features)"]["details_url"]; print(re.search(r"/actions/runs/([0-9]+)/", u).group(1))')"
          mkdir -p candidate/metadata/security
          gh run download "$SECURITY_RUN" \
            --name "sbom-all-$CANDIDATE_SHA" \
            --dir candidate/metadata/security \
            --repo "$REPOSITORY"
          # the receipts were resolved against the prepare phase's attested record; the promote
          # phase regenerated approval from the GitHub API minutes ago (promotion/), and the two
          # must select the same check runs
          python scripts/build_example_execution_manifest.py \
            --bundle release-checklists/0.8.1-repro-bundle.json \
            --candidate candidate/metadata/release-candidate.json \
            --wheel-metadata candidate/metadata/mixle-0.8.1-py3-none-any.whl.json \
            --receipt candidate/metadata/reproduction-gallery-univariate.json \
            --receipt candidate/metadata/reproduction-gallery-structured.json \
            --receipt candidate/metadata/reproduction-production-provenance.json \
            --receipt candidate/metadata/reproduction-scaling-backend.json \
            --check-evidence candidate/metadata/release-check-evidence.json \
            --check-evidence-bundle candidate/metadata/release-check-evidence.sigstore.json \
            --live-check-evidence promotion/release-check-evidence.json \
            --live-check-evidence-bundle promotion/release-check-evidence.sigstore.json \
            --out candidate/metadata/example-execution-manifest.json
          gh release upload "$CANDIDATE_TAG" \
            candidate/docs-dist/* \
            candidate/metadata/SHA256SUMS candidate/metadata/*.json \
            candidate/metadata/security/*.json \
            --clobber
      - name: Publish the already-verified files to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: candidate/dist/
          skip-existing: true
      - name: Require public-index bytes to equal the prepared artifacts
        env:
          VERSION: ${{ needs.verify-candidate.outputs.candidate-version }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            rm -rf public-artifacts
            mkdir public-artifacts
            if python -m pip download --no-deps --only-binary=:all: \
                 --dest public-artifacts "mixle==$VERSION" &&
               python -m pip download --no-deps --no-binary=:all: \
                 --dest public-artifacts "mixle==$VERSION"; then
              break
            fi
            # PyPI's simple index lists a fresh upload only after propagation (the same race the
            # TestPyPI rehearsal hit); wait up to ten minutes before calling the bytes missing.
            test "$attempt" -lt 40
            sleep 15
          done
          python scripts/verify_published_artifacts.py \
            --directory public-artifacts \
            --sums candidate/metadata/SHA256SUMS
      - name: Make the validated GitHub Release public
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ needs.verify-candidate.outputs.candidate-tag }}
        run: gh release edit "$CANDIDATE_TAG" --draft=false --latest
