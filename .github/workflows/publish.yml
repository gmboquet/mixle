name: Publish

# Trusted Publishing is deliberately downstream of release-candidate verification. A published
# GitHub Release is only a request to publish: its signed annotated tag, version, ancestry, exact
# commit checks, build output, and retained digests must all agree before PyPI credentials are
# requested. Manual dispatch builds the current commit but can never publish it.

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  checks: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name || github.sha }}
  cancel-in-progress: false

jobs:
  verify-candidate:
    name: Verify immutable release candidate
    runs-on: ubuntu-latest
    outputs:
      candidate-sha: ${{ steps.candidate.outputs.sha }}
      candidate-tag: ${{ steps.candidate.outputs.tag }}
      candidate-version: ${{ steps.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - id: candidate
        name: Bind tag, version, ancestry, signature, and hosted evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$EVENT_NAME" != "release" ]; then
            python -c 'import json, os, pathlib; pathlib.Path(os.environ["RUNNER_TEMP"], "release-check-evidence.json").write_text(json.dumps({"artifact": "mixle.release_check_evidence/v1", "commit": os.environ["EVENT_SHA"], "checks": {}, "publication_authorized": False}, sort_keys=True) + "\n", encoding="utf-8")'
            printf 'sha=%s\n' "$EVENT_SHA" >> "$GITHUB_OUTPUT"
            printf 'tag=\n' >> "$GITHUB_OUTPUT"
            printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          TAG="$RELEASE_TAG"
          test "$TAG" = "v$VERSION"
          test "$(git cat-file -t "refs/tags/$TAG")" = "tag"

          TAG_OBJECT_SHA="$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)"
          test "$(gh api "repos/$REPOSITORY/git/tags/$TAG_OBJECT_SHA" --jq .verification.verified)" = "true"
          SHA="$(gh api "repos/$REPOSITORY/git/tags/$TAG_OBJECT_SHA" --jq .object.sha)"
          test "$SHA" = "$(git rev-list -n 1 "refs/tags/$TAG")"

          git fetch origin release/0.8.0:refs/remotes/origin/release/0.8.0
          git merge-base --is-ancestor origin/release/0.8.0 "$SHA"
          test "$SHA" = "$(git rev-parse origin/release/0.8.0)"

          gh api "repos/$REPOSITORY/commits/$SHA/check-runs?per_page=100" > "$RUNNER_TEMP/check-runs.json"
          python scripts/verify_required_checks.py \
            --required .github/release-required-checks.txt \
            --input "$RUNNER_TEMP/check-runs.json" \
            --sha "$SHA" > "$RUNNER_TEMP/release-check-evidence.json"

          printf 'sha=%s\n' "$SHA" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v7
        with:
          name: candidate-approval-${{ steps.candidate.outputs.sha }}
          path: ${{ runner.temp }}/release-check-evidence.json
          if-no-files-found: error
          retention-days: 90

  build:
    name: Build and fingerprint exact candidate
    needs: verify-candidate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-candidate.outputs.candidate-sha }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          name: candidate-approval-${{ needs.verify-candidate.outputs.candidate-sha }}
          path: metadata
      - name: Build exact candidate
        env:
          CANDIDATE_SHA: ${{ needs.verify-candidate.outputs.candidate-sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          python -m pip install --upgrade pip build twine
          python -m pip install -r release-checklists/0.8.0-repro-requirements.txt
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct HEAD)"
          export MIXLE_SOURCE_COMMIT="$CANDIDATE_SHA"
          export MIXLE_SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          export MIXLE_SOURCE_DIRTY=false
          python -m build
          python scripts/normalize_sdist.py dist/*.tar.gz "$SOURCE_DATE_EPOCH"
          twine check dist/*
      - name: Record candidate and artifact digests
        env:
          CANDIDATE_SHA: ${{ needs.verify-candidate.outputs.candidate-sha }}
          CANDIDATE_TAG: ${{ needs.verify-candidate.outputs.candidate-tag }}
          CANDIDATE_VERSION: ${{ needs.verify-candidate.outputs.candidate-version }}
        run: |
          set -euo pipefail
          mkdir -p metadata
          for artifact in dist/*; do
            python scripts/release_metadata.py "$artifact" \
              --out "metadata/$(basename "$artifact").json"
          done
          (cd dist && sha256sum * > ../metadata/SHA256SUMS)
          python -c 'import json, os, pathlib; pathlib.Path("metadata/release-candidate.json").write_text(json.dumps({"artifact": "mixle.release_candidate/v1", "commit": os.environ["CANDIDATE_SHA"], "tag": os.environ["CANDIDATE_TAG"], "version": os.environ["CANDIDATE_VERSION"], "workflow_run": os.environ["GITHUB_RUN_ID"]}, indent=2, sort_keys=True) + "\n", encoding="utf-8")'
          for entry in gallery-univariate gallery-structured production-provenance scaling-backend; do
            python scripts/run_repro_entry.py --entry "$entry" > "metadata/reproduction-$entry.json"
          done
      - uses: actions/upload-artifact@v7
        with:
          name: release-candidate-${{ needs.verify-candidate.outputs.candidate-sha }}
          path: |
            dist/
            metadata/
          if-no-files-found: error
          retention-days: 90

  publish-pypi:
    name: Retain evidence and publish exact candidate to PyPI
    if: github.event_name == 'release'
    needs: [verify-candidate, build]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.verify-candidate.outputs.candidate-sha }}
      - uses: actions/download-artifact@v4
        with:
          name: release-candidate-${{ needs.verify-candidate.outputs.candidate-sha }}
          path: candidate
      - name: Re-verify and retain immutable release evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.verify-candidate.outputs.candidate-sha }}
          CANDIDATE_TAG: ${{ needs.verify-candidate.outputs.candidate-tag }}
          REPOSITORY: ${{ github.repository }}
        working-directory: candidate
        run: |
          set -euo pipefail
          test "$(python -c 'import json; print(json.load(open("metadata/release-candidate.json"))["commit"])')" = "$CANDIDATE_SHA"
          (cd dist && sha256sum -c ../metadata/SHA256SUMS)
          OPTIONAL_RUN="$(python -c 'import json, re; u=json.load(open("metadata/release-check-evidence.json"))["checks"]["optional extras / py3.12"]["details_url"]; print(re.search(r"/actions/runs/([0-9]+)/", u).group(1))')"
          mkdir -p metadata/network
          gh run download "$OPTIONAL_RUN" \
            --name banking77-reproduction-receipt \
            --dir metadata/network \
            --repo "$REPOSITORY"
          python ../scripts/build_example_execution_manifest.py \
            --bundle ../release-checklists/0.8.0-repro-bundle.json \
            --candidate metadata/release-candidate.json \
            --wheel-metadata metadata/mixle-0.8.0-py3-none-any.whl.json \
            --receipt metadata/reproduction-gallery-univariate.json \
            --receipt metadata/reproduction-gallery-structured.json \
            --receipt metadata/reproduction-production-provenance.json \
            --receipt metadata/reproduction-scaling-backend.json \
            --receipt metadata/network/banking77-reproduction-receipt.json \
            --out metadata/example-execution-manifest.json
          gh release upload "$CANDIDATE_TAG" \
            metadata/SHA256SUMS metadata/*.json metadata/network/*.json \
            --repo "$REPOSITORY"
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: candidate/dist/
