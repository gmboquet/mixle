name: Publish

# Publication is deliberately two phase and manually dispatched from the signed candidate tag:
#
#   prepare  - verify the exact release-branch tip and required checks, build/attest immutable
#              artifacts, retain the workflow artifact, and create a non-public draft release.
#   promote  - download that exact prepare-run artifact, re-verify every digest, publish the
#              already-validated files to PyPI, and only then make the GitHub Release public.
#
# A failed build can therefore never follow a public GitHub Release. A failure after the idempotent
# PyPI upload leaves a recoverable draft; rerunning promote verifies the same bytes and completes
# the final public transition.

on:
  workflow_dispatch:
    inputs:
      phase:
        description: "prepare artifacts, rehearse them on TestPyPI, or promote them"
        required: true
        type: choice
        options: [prepare, testpypi, promote]
      tag:
        description: "Signed annotated candidate tag (for example v0.8.0)"
        required: true
        type: string
      prepare_run_id:
        description: "Successful prepare workflow run ID (required for testpypi/promote)"
        required: false
        type: string
      testpypi_run_id:
        description: "Successful TestPyPI rehearsal run ID (required for promote)"
        required: false
        type: string

permissions:
  contents: read
  checks: read

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  verify-candidate:
    name: Verify immutable release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      candidate-sha: ${{ steps.candidate.outputs.sha }}
      candidate-tag: ${{ steps.candidate.outputs.tag }}
      candidate-version: ${{ steps.candidate.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ inputs.tag }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - id: candidate
        name: Bind tag, version, ancestry, signature, and hosted evidence
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
          REPOSITORY: ${{ github.repository }}
          EVENT_SHA: ${{ github.sha }}
          PHASE: ${{ inputs.phase }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
          TESTPYPI_RUN_ID: ${{ inputs.testpypi_run_id }}
        run: |
          set -euo pipefail
          VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          TAG="$RELEASE_TAG"
          test "$TAG" = "v$VERSION"
          test "$(git cat-file -t "refs/tags/$TAG")" = "tag"

          TAG_OBJECT_SHA="$(gh api "repos/$REPOSITORY/git/ref/tags/$TAG" --jq .object.sha)"
          test "$(gh api "repos/$REPOSITORY/git/tags/$TAG_OBJECT_SHA" --jq .verification.verified)" = "true"
          SHA="$(gh api "repos/$REPOSITORY/git/tags/$TAG_OBJECT_SHA" --jq .object.sha)"
          test "$SHA" = "$(git rev-list -n 1 "refs/tags/$TAG")"
          test "$EVENT_SHA" = "$SHA"

          RELEASE_SHA="$(gh api "repos/$REPOSITORY/branches/release/0.8.0" --jq .commit.sha)"
          test "$SHA" = "$RELEASE_SHA"

          if [ "$PHASE" = "promote" ]; then
            test -n "$PREPARE_RUN_ID"
            test -n "$TESTPYPI_RUN_ID"
            case "$PREPARE_RUN_ID" in *[!0-9]*) exit 1;; esac
            case "$TESTPYPI_RUN_ID" in *[!0-9]*) exit 1;; esac
          elif [ "$PHASE" = "testpypi" ]; then
            test -n "$PREPARE_RUN_ID"
            test -z "$TESTPYPI_RUN_ID"
            case "$PREPARE_RUN_ID" in *[!0-9]*) exit 1;; esac
          else
            test -z "$PREPARE_RUN_ID"
            test -z "$TESTPYPI_RUN_ID"
          fi

          python scripts/verify_license_provenance.py --require-approved
          python scripts/check_release_document_state.py --version "$VERSION"
          python scripts/verify_release_checklist.py \
            --checklist release-checklists/0.8.0.md \
            --receipts release-checklists/0.8.0-receipts \
            --candidate-sha "$SHA" \
            --require-final
          gh api "repos/$REPOSITORY/commits/$SHA/check-runs?per_page=100" > "$RUNNER_TEMP/check-runs.json"
          python scripts/verify_required_checks.py \
            --required .github/release-required-checks.txt \
            --input "$RUNNER_TEMP/check-runs.json" \
            --sha "$SHA" > "$RUNNER_TEMP/release-check-evidence.json"

          printf 'sha=%s\n' "$SHA" >> "$GITHUB_OUTPUT"
          printf 'tag=%s\n' "$TAG" >> "$GITHUB_OUTPUT"
          printf 'version=%s\n' "$VERSION" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: candidate-approval-${{ steps.candidate.outputs.sha }}-${{ inputs.phase }}
          path: ${{ runner.temp }}/release-check-evidence.json
          if-no-files-found: error
          retention-days: 90

  build:
    name: Prepare exact candidate and draft release
    if: inputs.phase == 'prepare'
    needs: verify-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.verify-candidate.outputs.candidate-sha }}
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-approval-${{ needs.verify-candidate.outputs.candidate-sha }}-prepare
          path: metadata
      - name: Build exact candidate
        env:
          CANDIDATE_SHA: ${{ needs.verify-candidate.outputs.candidate-sha }}
          CANDIDATE_VERSION: ${{ needs.verify-candidate.outputs.candidate-version }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"
          python -m pip install --upgrade "pip==26.1.2"
          python -m pip install -r release-checklists/0.8.0-build-requirements.txt
          python -m pip install -r release-checklists/0.8.0-repro-requirements.txt
          export SOURCE_DATE_EPOCH="$(git log -1 --pretty=%ct HEAD)"
          export MIXLE_SOURCE_COMMIT="$CANDIDATE_SHA"
          export MIXLE_SOURCE_TREE="$(git rev-parse 'HEAD^{tree}')"
          export MIXLE_SOURCE_DIRTY=false
          mkdir source-a source-b dist-a dist-b dist
          git archive HEAD | tar -x -C source-a
          git archive HEAD | tar -x -C source-b
          python scripts/build_environment_receipt.py \
            --requirements release-checklists/0.8.0-build-requirements.txt \
            --out metadata/build-environment.json
          (cd source-a && python -m build --no-isolation --outdir ../dist-a)
          (cd source-b && python -m build --no-isolation --outdir ../dist-b)
          python scripts/normalize_sdist.py dist-a/*.tar.gz "$SOURCE_DATE_EPOCH"
          python scripts/normalize_sdist.py dist-b/*.tar.gz "$SOURCE_DATE_EPOCH"
          python scripts/verify_reproducible_builds.py \
            --left dist-a --right dist-b --out metadata/reproducible-builds.json
          cp dist-a/* dist/
          twine check dist/*
          python -m pip install -e ".[docs]"
          python -m sphinx -b html -W --keep-going docs "$RUNNER_TEMP/docs-html"
          python scripts/package_docs_archive.py \
            --source "$RUNNER_TEMP/docs-html" \
            --output "docs-dist/mixle-docs-v$CANDIDATE_VERSION.tar.gz" \
            --version "$CANDIDATE_VERSION" \
            --commit "$CANDIDATE_SHA" \
            --source-date-epoch "$SOURCE_DATE_EPOCH"
      - name: Record candidate and artifact digests
        env:
          CANDIDATE_SHA: ${{ needs.verify-candidate.outputs.candidate-sha }}
          CANDIDATE_TAG: ${{ needs.verify-candidate.outputs.candidate-tag }}
          CANDIDATE_VERSION: ${{ needs.verify-candidate.outputs.candidate-version }}
        run: |
          set -euo pipefail
          for artifact in dist/*; do
            python scripts/release_metadata.py "$artifact" \
              --out "metadata/$(basename "$artifact").json"
          done
          (cd dist && sha256sum * > ../metadata/SHA256SUMS)
          python -m venv "$RUNNER_TEMP/sbom-artifact-env"
          "$RUNNER_TEMP/sbom-artifact-env/bin/python" -m pip install dist/*.whl
          SITE=$("$RUNNER_TEMP/sbom-artifact-env/bin/python" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
          python -m venv "$RUNNER_TEMP/sbom-tool-env"
          "$RUNNER_TEMP/sbom-tool-env/bin/python" -m pip install pip-audit
          python scripts/verify_vulnerability_waivers.py \
            --input .github/pip-audit-waivers.json --profile base \
            --args-out metadata/waiver-args.txt \
            --receipt metadata/accepted-waivers.json
          mapfile -t WAIVERS < metadata/waiver-args.txt
          "$RUNNER_TEMP/sbom-tool-env/bin/pip-audit" \
            --path "$SITE" "${WAIVERS[@]}" \
            --format cyclonedx-json -o metadata/raw-sbom.json
          python scripts/bind_sbom.py \
            --cyclonedx metadata/raw-sbom.json \
            --wheel-metadata metadata/mixle-0.8.0-py3-none-any.whl.json \
            --candidate-sha "$CANDIDATE_SHA" \
            --waivers metadata/accepted-waivers.json \
            --out metadata/sbom.json
          rm metadata/raw-sbom.json metadata/waiver-args.txt
          python -c 'import json, os, pathlib; pathlib.Path("metadata/release-candidate.json").write_text(json.dumps({"artifact": "mixle.release_candidate/v1", "commit": os.environ["CANDIDATE_SHA"], "tag": os.environ["CANDIDATE_TAG"], "version": os.environ["CANDIDATE_VERSION"], "workflow_run": os.environ["GITHUB_RUN_ID"]}, indent=2, sort_keys=True) + "\n", encoding="utf-8")'
          for entry in gallery-univariate gallery-structured production-provenance scaling-backend; do
            python scripts/run_repro_entry.py --entry "$entry" > "metadata/reproduction-$entry.json"
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-candidate-${{ needs.verify-candidate.outputs.candidate-sha }}
          path: |
            dist/
            docs-dist/
            metadata/
          if-no-files-found: error
          retention-days: 90
      - name: Create or update a non-public draft release
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ needs.verify-candidate.outputs.candidate-tag }}
        run: |
          set -euo pipefail
          if gh release view "$CANDIDATE_TAG" --json isDraft >/dev/null 2>&1; then
            test "$(gh release view "$CANDIDATE_TAG" --json isDraft --jq .isDraft)" = "true"
          else
            gh release create "$CANDIDATE_TAG" --verify-tag --draft \
              --title "mixle ${{ needs.verify-candidate.outputs.candidate-version }}" \
              --generate-notes
          fi
          gh release upload "$CANDIDATE_TAG" dist/* docs-dist/* metadata/* --clobber

  testpypi:
    name: Rehearse exact candidate on TestPyPI
    if: inputs.phase == 'testpypi'
    needs: verify-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: testpypi
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.verify-candidate.outputs.candidate-sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate-${{ needs.verify-candidate.outputs.candidate-sha }}
          path: candidate
          run-id: ${{ inputs.prepare_run_id }}
          github-token: ${{ github.token }}
      - name: Verify the prepared TestPyPI candidate
        env:
          CANDIDATE_SHA: ${{ needs.verify-candidate.outputs.candidate-sha }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
        run: |
          set -euo pipefail
          test "$(python -c 'import json; print(json.load(open("candidate/metadata/release-candidate.json"))["commit"])')" = "$CANDIDATE_SHA"
          test "$(python -c 'import json; print(json.load(open("candidate/metadata/release-candidate.json"))["workflow_run"])')" = "$PREPARE_RUN_ID"
          (cd candidate/dist && sha256sum -c ../metadata/SHA256SUMS)
      - name: Upload the already-verified files to TestPyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: candidate/dist/
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
      - name: Download, verify, install, and smoke the TestPyPI bytes
        env:
          VERSION: ${{ needs.verify-candidate.outputs.candidate-version }}
          CANDIDATE_SHA: ${{ needs.verify-candidate.outputs.candidate-sha }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            rm -rf testpypi-artifacts
            mkdir testpypi-artifacts
            if python -m pip download --index-url https://test.pypi.org/simple \
                 --no-deps --only-binary=:all: --dest testpypi-artifacts "mixle==$VERSION" &&
               python -m pip download --index-url https://test.pypi.org/simple \
                 --no-deps --no-binary=:all: --dest testpypi-artifacts "mixle==$VERSION"; then
              break
            fi
            test "$attempt" -lt 6
            sleep 10
          done
          python scripts/verify_published_artifacts.py \
            --directory testpypi-artifacts \
            --sums candidate/metadata/SHA256SUMS
          python -m venv "$RUNNER_TEMP/testpypi-env"
          "$RUNNER_TEMP/testpypi-env/bin/python" -m pip install testpypi-artifacts/*.whl
          "$RUNNER_TEMP/testpypi-env/bin/python" scripts/import_sweep.py
          python -c 'import hashlib,json,os,pathlib; sums=pathlib.Path("candidate/metadata/SHA256SUMS"); pathlib.Path("testpypi-rehearsal.json").write_text(json.dumps({"artifact":"mixle.testpypi_rehearsal/v1","candidate_commit":os.environ["CANDIDATE_SHA"],"prepare_run":os.environ["PREPARE_RUN_ID"],"sums_sha256":hashlib.sha256(sums.read_bytes()).hexdigest(),"passed":True},sort_keys=True)+"\n")'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: testpypi-rehearsal-${{ needs.verify-candidate.outputs.candidate-sha }}
          path: testpypi-rehearsal.json
          if-no-files-found: error
          retention-days: 90

  promote:
    name: Promote prepared artifacts and publish release
    if: inputs.phase == 'promote'
    needs: verify-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: pypi
    permissions:
      actions: read
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          ref: ${{ needs.verify-candidate.outputs.candidate-sha }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release-candidate-${{ needs.verify-candidate.outputs.candidate-sha }}
          path: candidate
          run-id: ${{ inputs.prepare_run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: candidate-approval-${{ needs.verify-candidate.outputs.candidate-sha }}-promote
          path: promotion
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: testpypi-rehearsal-${{ needs.verify-candidate.outputs.candidate-sha }}
          path: testpypi
          run-id: ${{ inputs.testpypi_run_id }}
          github-token: ${{ github.token }}
      - name: Re-verify immutable prepared evidence
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ needs.verify-candidate.outputs.candidate-sha }}
          CANDIDATE_TAG: ${{ needs.verify-candidate.outputs.candidate-tag }}
          PREPARE_RUN_ID: ${{ inputs.prepare_run_id }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          test "$(gh release view "$CANDIDATE_TAG" --json isDraft --jq .isDraft)" = "true"
          test "$(python -c 'import json; print(json.load(open("candidate/metadata/release-candidate.json"))["commit"])')" = "$CANDIDATE_SHA"
          test "$(python -c 'import json; print(json.load(open("candidate/metadata/release-candidate.json"))["workflow_run"])')" = "$PREPARE_RUN_ID"
          test "$(python -c 'import json; print(json.load(open("testpypi/testpypi-rehearsal.json"))["candidate_commit"])')" = "$CANDIDATE_SHA"
          test "$(python -c 'import json; print(json.load(open("testpypi/testpypi-rehearsal.json"))["prepare_run"])')" = "$PREPARE_RUN_ID"
          test "$(python -c 'import hashlib,json; r=json.load(open("testpypi/testpypi-rehearsal.json")); print(r["sums_sha256"] == hashlib.sha256(open("candidate/metadata/SHA256SUMS","rb").read()).hexdigest())')" = "True"
          cp promotion/release-check-evidence.json candidate/metadata/promotion-check-evidence.json
          (cd candidate/dist && sha256sum -c ../metadata/SHA256SUMS)
          OPTIONAL_RUN="$(python -c 'import json, re; u=json.load(open("promotion/release-check-evidence.json"))["checks"]["optional extras / py3.12"]["details_url"]; print(re.search(r"/actions/runs/([0-9]+)/", u).group(1))')"
          SECURITY_RUN="$(python -c 'import json, re; u=json.load(open("promotion/release-check-evidence.json"))["checks"]["pip-audit (all runtime features)"]["details_url"]; print(re.search(r"/actions/runs/([0-9]+)/", u).group(1))')"
          mkdir -p candidate/metadata/network
          mkdir -p candidate/metadata/security
          gh run download "$OPTIONAL_RUN" \
            --name banking77-reproduction-receipt \
            --dir candidate/metadata/network \
            --repo "$REPOSITORY"
          gh run download "$SECURITY_RUN" \
            --name "sbom-all-$CANDIDATE_SHA" \
            --dir candidate/metadata/security \
            --repo "$REPOSITORY"
          python scripts/build_example_execution_manifest.py \
            --bundle release-checklists/0.8.0-repro-bundle.json \
            --candidate candidate/metadata/release-candidate.json \
            --wheel-metadata candidate/metadata/mixle-0.8.0-py3-none-any.whl.json \
            --receipt candidate/metadata/reproduction-gallery-univariate.json \
            --receipt candidate/metadata/reproduction-gallery-structured.json \
            --receipt candidate/metadata/reproduction-production-provenance.json \
            --receipt candidate/metadata/reproduction-scaling-backend.json \
            --receipt candidate/metadata/network/banking77-reproduction-receipt.json \
            --out candidate/metadata/example-execution-manifest.json
          gh release upload "$CANDIDATE_TAG" \
            candidate/docs-dist/* \
            candidate/metadata/SHA256SUMS candidate/metadata/*.json \
            candidate/metadata/network/*.json candidate/metadata/security/*.json \
            --clobber
      - name: Publish the already-verified files to PyPI
        uses: pypa/gh-action-pypi-publish@ba38be9e461d3875417946c167d0b5f3d385a247 # release/v1
        with:
          packages-dir: candidate/dist/
          skip-existing: true
      - name: Require public-index bytes to equal the prepared artifacts
        env:
          VERSION: ${{ needs.verify-candidate.outputs.candidate-version }}
        run: |
          set -euo pipefail
          for attempt in 1 2 3 4 5 6; do
            rm -rf public-artifacts
            mkdir public-artifacts
            if python -m pip download --no-deps --only-binary=:all: \
                 --dest public-artifacts "mixle==$VERSION" &&
               python -m pip download --no-deps --no-binary=:all: \
                 --dest public-artifacts "mixle==$VERSION"; then
              break
            fi
            test "$attempt" -lt 6
            sleep 10
          done
          python scripts/verify_published_artifacts.py \
            --directory public-artifacts \
            --sums candidate/metadata/SHA256SUMS
      - name: Make the validated GitHub Release public
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_TAG: ${{ needs.verify-candidate.outputs.candidate-tag }}
        run: gh release edit "$CANDIDATE_TAG" --draft=false --latest
