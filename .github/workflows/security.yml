name: Security

# Scan the resolved dependency set for known vulnerabilities. The gate runs weekly, on every active
# release-tip update, on main, on dependency-changing pull requests, and by manual dispatch. Findings
# are blocking unless their identifier, rationale, and review date are explicitly recorded in the
# audited waiver file.

on:
  push:
    branches: [main, release/0.8.0]
  pull_request:
    paths:
      - "pyproject.toml"
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pip-audit:
    name: pip-audit (base install)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package (base extras only)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install pip-audit
      - name: Audit resolved dependencies
        # Blocking: a known vulnerability in a base dependency fails CI. To accept a specific finding
        # temporarily, add its ID (with a reason + review date) to .github/pip-audit-ignore.txt; only
        # IDs listed there are waived.
        run: |
          IGNORES=$(grep -vE '^[[:space:]]*#|^[[:space:]]*$' .github/pip-audit-ignore.txt | awk '{printf " --ignore-vuln %s", $1}')
          echo "waived vulns:${IGNORES:- (none)}"
          pip-audit $IGNORES
      # Software bill of materials: the resolved base-install dependency set, in CycloneDX JSON, from
      # the same pip-audit invocation already used for vulnerability scanning above (no new tool).
      # Best-effort and non-blocking for now -- SBOM generation failing should not fail the vulnerability
      # gate above, which is the part this job actually exists to enforce.
      - name: Generate SBOM (CycloneDX JSON)
        if: always()
        continue-on-error: true
        run: pip-audit --format cyclonedx-json -o sbom.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sbom
          path: sbom.json
          if-no-files-found: warn
