name: Security

# Scan the resolved dependency set for known vulnerabilities. The gate runs weekly, on every active
# release-tip update, on main, on dependency-changing pull requests, and by manual dispatch. Findings
# are blocking unless their identifier, rationale, and review date are explicitly recorded in the
# audited waiver file.

on:
  push:
    branches: [main, release/0.8.0]
  pull_request:
    paths:
      - "pyproject.toml"
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit (base install)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build and install the exact wheel in an isolated artifact environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install build
          python -m build --wheel --outdir dist
          python -m venv "$RUNNER_TEMP/artifact-env"
          "$RUNNER_TEMP/artifact-env/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/artifact-env/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/artifact-env/bin/python" -m pip check
          python scripts/release_metadata.py dist/*.whl --out wheel-metadata.json
      - name: Install the audit tool outside the artifact environment
        run: |
          python -m venv "$RUNNER_TEMP/audit-tool"
          "$RUNNER_TEMP/audit-tool/bin/python" -m pip install --upgrade pip pip-audit
      - name: Audit only the isolated wheel environment
        # Blocking: a known vulnerability in a base dependency fails CI. To accept a specific finding
        # temporarily, add its ID (with a reason + review date) to .github/pip-audit-ignore.txt; only
        # IDs listed there are waived.
        run: |
          SITE=$("$RUNNER_TEMP/artifact-env/bin/python" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
          IGNORES=$(grep -vE '^[[:space:]]*#|^[[:space:]]*$' .github/pip-audit-ignore.txt | awk '{printf " --ignore-vuln %s", $1}')
          echo "waived vulns:${IGNORES:- (none)}"
          "$RUNNER_TEMP/audit-tool/bin/pip-audit" --path "$SITE" $IGNORES
      - name: Generate and bind the artifact SBOM
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          SITE=$("$RUNNER_TEMP/artifact-env/bin/python" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
          "$RUNNER_TEMP/audit-tool/bin/pip-audit" --path "$SITE" --format cyclonedx-json -o raw-sbom.json
          python scripts/bind_sbom.py \
            --cyclonedx raw-sbom.json \
            --wheel-metadata wheel-metadata.json \
            --candidate-sha "$CANDIDATE_SHA" \
            --profile base \
            --out sbom.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json
          if-no-files-found: error
          retention-days: 90

  pip-audit-all:
    name: pip-audit (all runtime features)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install native prerequisites
        run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin libgmp-dev
      - name: Build and install exact wheel with the complete runtime-feature union
        run: |
          python -m pip install --upgrade pip build
          python -m build --wheel --outdir dist
          python -m venv "$RUNNER_TEMP/artifact-all-env"
          "$RUNNER_TEMP/artifact-all-env/bin/python" -m pip install --upgrade pip
          WHEEL="$(printf '%s\n' dist/*.whl)"
          "$RUNNER_TEMP/artifact-all-env/bin/python" -m pip install "$WHEEL[all]"
          "$RUNNER_TEMP/artifact-all-env/bin/python" -m pip check
          python scripts/release_metadata.py dist/*.whl --out wheel-metadata.json
      - name: Audit complete runtime-feature environment
        run: |
          python -m venv "$RUNNER_TEMP/audit-tool"
          "$RUNNER_TEMP/audit-tool/bin/python" -m pip install --upgrade pip pip-audit
          SITE=$("$RUNNER_TEMP/artifact-all-env/bin/python" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
          IGNORES=$(grep -vE '^[[:space:]]*#|^[[:space:]]*$' .github/pip-audit-ignore.txt | awk '{printf " --ignore-vuln %s", $1}')
          "$RUNNER_TEMP/audit-tool/bin/pip-audit" --path "$SITE" $IGNORES
          "$RUNNER_TEMP/audit-tool/bin/pip-audit" --path "$SITE" --format cyclonedx-json -o raw-sbom-all.json
      - name: Bind complete-runtime SBOM to candidate and wheel
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          python scripts/bind_sbom.py \
            --cyclonedx raw-sbom-all.json \
            --wheel-metadata wheel-metadata.json \
            --candidate-sha "$CANDIDATE_SHA" \
            --profile all \
            --out sbom-all.json
      - uses: actions/upload-artifact@v7
        with:
          name: sbom-all-${{ github.sha }}
          path: sbom-all.json
          if-no-files-found: error
          retention-days: 90

  source-security:
    name: bandit (source security)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run scoped source security analysis
        run: |
          python -m venv "$RUNNER_TEMP/bandit-tool"
          "$RUNNER_TEMP/bandit-tool/bin/python" -m pip install --upgrade pip "bandit[toml]==1.8.6"
          "$RUNNER_TEMP/bandit-tool/bin/bandit" -r mixle scripts \
            -x mixle/tests -ll -ii -f json -o bandit.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bandit-${{ github.sha }}
          path: bandit.json
          if-no-files-found: error
          retention-days: 90
