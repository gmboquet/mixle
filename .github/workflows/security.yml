name: Security

# Scan the resolved dependency set for known vulnerabilities. The gate runs weekly, on every active
# release-tip update, on main, on dependency-changing pull requests, and by manual dispatch. Findings
# are blocking unless their identifier, rationale, and review date are explicitly recorded in the
# audited waiver file.

on:
  push:
    branches: [main, release/0.8.0]
  pull_request:
    paths:
      - "pyproject.toml"
      - "constraints*.txt"
      - ".github/workflows/security.yml"
      - ".github/pip-audit-waivers.json"
      - ".gitleaks.toml"
      - "manifests/dependency_drift_policy.json"
      - "scripts/bind_sbom.py"
      - "scripts/check_dependency_bounds.py"
  schedule:
    - cron: "23 6 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secret-history:
    name: gitleaks (full history)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_CONFIG: .gitleaks.toml

  pip-audit:
    name: pip-audit (base install)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build and install the exact wheel in an isolated artifact environment
        run: |
          python -m pip install --upgrade "pip==26.1.2"
          python -m pip install -r release-checklists/0.8.0-build-requirements.txt
          python -m build --no-isolation --wheel --outdir dist
          python -m venv "$RUNNER_TEMP/artifact-env"
          "$RUNNER_TEMP/artifact-env/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/artifact-env/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/artifact-env/bin/python" -m pip check
          python scripts/release_metadata.py dist/*.whl --out wheel-metadata.json
      - name: Install the audit tool outside the artifact environment
        run: |
          python -m venv "$RUNNER_TEMP/audit-tool"
          "$RUNNER_TEMP/audit-tool/bin/python" -m pip install --upgrade pip pip-audit
      - name: Audit only the isolated wheel environment
        # Blocking: a known vulnerability in a base dependency fails CI. To accept a specific finding
        # temporarily, add its ID (with a reason + review date) to .github/pip-audit-ignore.txt; only
        # IDs listed there are waived.
        run: |
          SITE=$("$RUNNER_TEMP/artifact-env/bin/python" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
          python scripts/verify_vulnerability_waivers.py \
            --input .github/pip-audit-waivers.json --profile base \
            --args-out waiver-args.txt --receipt accepted-waivers.json
          mapfile -t WAIVERS < waiver-args.txt
          "$RUNNER_TEMP/audit-tool/bin/pip-audit" --path "$SITE" "${WAIVERS[@]}"
      - name: Generate and bind the artifact SBOM
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          SITE=$("$RUNNER_TEMP/artifact-env/bin/python" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
          # same-waiver SBOM pass as the all-features job (symmetric latent bug: this line
          # would fail the day a base-profile waiver exists)
          "$RUNNER_TEMP/audit-tool/bin/pip-audit" --path "$SITE" "${WAIVERS[@]}" --format cyclonedx-json -o raw-sbom.json
          python scripts/bind_sbom.py \
            --cyclonedx raw-sbom.json \
            --wheel-metadata wheel-metadata.json \
            --candidate-sha "$CANDIDATE_SHA" \
            --profile base \
            --waivers accepted-waivers.json \
            --out sbom.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-${{ github.sha }}
          path: |
            sbom.json
            accepted-waivers.json
          if-no-files-found: error
          retention-days: 90

  pip-audit-all:
    name: pip-audit (all runtime features)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install native prerequisites
        run: sudo apt-get update && sudo apt-get install -y libopenmpi-dev openmpi-bin libgmp-dev
      - name: Build and install exact wheel with the complete runtime-feature union
        run: |
          python -m pip install --upgrade "pip==26.1.2"
          python -m pip install -r release-checklists/0.8.0-build-requirements.txt
          python -m build --no-isolation --wheel --outdir dist
          python -m venv "$RUNNER_TEMP/artifact-all-env"
          "$RUNNER_TEMP/artifact-all-env/bin/python" -m pip install --upgrade pip
          WHEEL="$(printf '%s\n' dist/*.whl)"
          "$RUNNER_TEMP/artifact-all-env/bin/python" -m pip install "$WHEEL[all]"
          "$RUNNER_TEMP/artifact-all-env/bin/python" -m pip check
          python scripts/release_metadata.py dist/*.whl --out wheel-metadata.json
      - name: Audit complete runtime-feature environment
        run: |
          python -m venv "$RUNNER_TEMP/audit-tool"
          "$RUNNER_TEMP/audit-tool/bin/python" -m pip install --upgrade pip pip-audit
          SITE=$("$RUNNER_TEMP/artifact-all-env/bin/python" -c 'import sysconfig; print(sysconfig.get_paths()["purelib"])')
          python scripts/verify_vulnerability_waivers.py \
            --input .github/pip-audit-waivers.json --profile all \
            --args-out waiver-args-all.txt --receipt accepted-waivers-all.json
          mapfile -t WAIVERS < waiver-args-all.txt
          "$RUNNER_TEMP/audit-tool/bin/pip-audit" --path "$SITE" "${WAIVERS[@]}"
          # the SBOM pass runs under the SAME accepted waivers: pip-audit exits nonzero on any
          # finding regardless of output format, so an unwaived SBOM pass failed the job even
          # though the gating audit above had already accepted the waiver; the bound SBOM
          # embeds the full waiver record, so the audit trail is preserved there
          "$RUNNER_TEMP/audit-tool/bin/pip-audit" --path "$SITE" "${WAIVERS[@]}" --format cyclonedx-json -o raw-sbom-all.json
      - name: Bind complete-runtime SBOM to candidate and wheel
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          python scripts/bind_sbom.py \
            --cyclonedx raw-sbom-all.json \
            --wheel-metadata wheel-metadata.json \
            --candidate-sha "$CANDIDATE_SHA" \
            --profile all \
            --waivers accepted-waivers-all.json \
            --out sbom-all.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: sbom-all-${{ github.sha }}
          path: |
            sbom-all.json
            accepted-waivers-all.json
          if-no-files-found: error
          retention-days: 90

  source-security:
    name: bandit (source security)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Run scoped source security analysis
        run: |
          python -m venv "$RUNNER_TEMP/bandit-tool"
          "$RUNNER_TEMP/bandit-tool/bin/python" -m pip install --upgrade pip "bandit[toml]==1.8.6"
          "$RUNNER_TEMP/bandit-tool/bin/bandit" -r mixle scripts \
            -x mixle/tests -ll -ii -f json -o bandit.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: bandit-${{ github.sha }}
          path: bandit.json
          if-no-files-found: error
          retention-days: 90
