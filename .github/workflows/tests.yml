name: Tests

on:
  # Main and the active release branch run exact-tip CI. Pull-request branches are covered by the
  # pull_request event, so ordinary work branches do not trigger duplicate runs.
  push:
    branches: [main, release/0.8.0]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

# Cancel superseded runs (e.g. rapid pushes to the same PR / branch) instead of piling them up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  decision-reviews:
    name: release decisions / accepted review
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/release/0.8.0')
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Block release sign-off on pending decision reviews
        run: python scripts/verify_decision_reviews.py release-checklists/0.8.0-decisions.md

  smoke:
    name: smoke / collection-light
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install base smoke harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run explicit smoke manifest
        run: python scripts/run_smoke.py --out smoke-receipt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smoke-receipt
          path: smoke-receipt.json
          if-no-files-found: error

  lint:
    name: lint (ruff enforced, mypy advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[lint]"
      # ruff is enforced: the tree is formatted and lint-clean under the rules in pyproject.toml.
      - name: ruff format --check
        run: ruff format --check mixle
      - name: ruff check
        run: ruff check mixle
      - name: Parse and validate release workflows
        run: python scripts/check_workflows.py
      # Y4.4 architecture contracts ([tool.importlinter] in pyproject.toml): experimental is never a
      # dependency of the stable core; distribution kernels / engines carry no direct orchestration
      # imports. Static graph analysis (grimp) -- imports nothing, so no optional extras needed here.
      - name: lint-imports (architecture contracts)
        run: lint-imports
      # A curated typed-core is checked strictly and BLOCKING (worklist Y4.1): these modules are fully
      # annotated and clean under disallow_untyped_defs (see the [[tool.mypy.overrides]] typed-core list in
      # pyproject.toml). --follow-imports=skip keeps the check to these modules' own annotations so a
      # dependency's or an untyped sibling's errors cannot leak in. The list grows as more modules qualify.
      - name: mypy (typed core, blocking)
        run: |
          mypy --follow-imports=skip mixle/scorecard.py mixle/spend.py mixle/registry.py \
            mixle/system/__init__.py mixle/system/core.py mixle/system/spend.py \
            mixle/system/registry.py mixle/system/scorecard.py
      # The whole-tree mypy stays advisory until the rest of the type-checking backlog is addressed.
      - name: mypy (whole tree, advisory)
        continue-on-error: true
        run: mypy

  fast:
    name: core / py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # `highprec` (mpmath) is installed alongside `test` here so vmf_test.py / kent_test.py /
      # lkj_test.py / bingham_test.py's exact-normalizer checks keep actually running (not skipping) now
      # that mpmath is an optional extra rather than a base dependency (worklist P2.2).
      - name: Install package and test harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,highprec]"
      - name: Run the hard-budget core tier
        run: |
          python scripts/run_test_tier.py \
            --tier core \
            --candidate-sha "$GITHUB_SHA" \
            --budget-seconds 480 \
            --receipt "core-py${{ matrix.python-version }}.json" \
            -- -n auto
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: core-tier-py${{ matrix.python-version }}
          path: core-py${{ matrix.python-version }}.json
          if-no-files-found: error
          retention-days: 90

  fast-macos:
    name: core / macOS arm64 / py${{ matrix.python-version }}
    # macOS arm64 is the day-to-day dev platform; this gates it in CI so the "Operating System :: MacOS"
    # classifier and the README's macOS claim are backed by a run, not just ad-hoc local use.
    runs-on: macos-14
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,highprec]"
      - name: Run the hard-budget core tier
        run: |
          python scripts/run_test_tier.py \
            --tier core \
            --candidate-sha "$GITHUB_SHA" \
            --budget-seconds 480 \
            --receipt "core-macos-py${{ matrix.python-version }}.json" \
            -- -n auto
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: core-macos-tier-py${{ matrix.python-version }}
          path: core-macos-py${{ matrix.python-version }}.json
          if-no-files-found: error
          retention-days: 90

  min-versions:
    name: core / minimum versions
    # Install at the OLDEST declared dependency floors (constraints-min.txt) on the oldest supported
    # Python and run the fast suite, so a floor that is missing an API, unbuildable, or numerically
    # incompatible fails here instead of silently passing on whatever newer version pip resolves.
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package at the declared minimum dependency versions
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-min.txt -e ".[test,highprec]"
          python -c "import numpy, scipy, mpmath; print('numpy', numpy.__version__, 'scipy', scipy.__version__, 'mpmath', mpmath.__version__)"
      - name: Run the hard-budget core tier at the minimum floors
        run: |
          python scripts/run_test_tier.py \
            --tier core \
            --candidate-sha "$GITHUB_SHA" \
            --budget-seconds 480 \
            --receipt core-minimum-versions.json \
            -- -n auto
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: core-minimum-versions
          path: core-minimum-versions.json
          if-no-files-found: error
          retention-days: 90

  full:
    name: full / py3.12
    # Runs in parallel with `fast` (no `needs:`) to cut wall-clock; -n auto parallelizes within.
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,highprec]"
      - name: Run full non-optional suite with coverage
        # --cov-fail-under=45 is a deliberately conservative CATASTROPHIC-REGRESSION floor, not a coverage
        # target. This base install skips every optional backend (torch/numba/spark/dask/jax/...), so line
        # coverage here is a floor of the real number (locally, with the backends installed, the fast suite
        # alone covers ~72%); a threshold set near the true number would misrepresent it and block unrelated
        # PRs. 45% trips only when a whole subsystem's tests vanish -- e.g. a bad merge dropping a test
        # directory -- which is exactly the regression a gate must catch. Raise it once the optional-extras
        # job also reports coverage and the two are combined into a representative number.
        run: |
          python scripts/run_test_tier.py \
            --tier full \
            --candidate-sha "$GITHUB_SHA" \
            --budget-seconds 1800 \
            --receipt full-py3.12.json \
            -- -n auto --cov --cov-report=xml --cov-report=term --cov-fail-under=45
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-xml
          path: |
            coverage.xml
            full-py3.12.json
          if-no-files-found: error
          retention-days: 30

  clean-wheel:
    name: clean-wheel install + import sweep
    # A base install of the BUILT WHEEL (not an editable checkout, no optional extras) must import every
    # public module. An optional dependency imported at a module's top level breaks `import mixle...` for
    # every base-install user -- a regression that shipped in the wheel before (numba, mpi4py).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build the wheel and source distribution
        run: |
          python -m pip install --upgrade "pip==26.1.2"
          python -m pip install -r release-checklists/0.8.0-build-requirements.txt
          python -m build --no-isolation --outdir dist
      - name: Install each artifact into its own clean base environment
        run: |
          python -m venv "$RUNNER_TEMP/clean-wheel-env"
          python -m venv "$RUNNER_TEMP/clean-sdist-env"
          for kind in wheel sdist; do
            env="$RUNNER_TEMP/clean-$kind-env"
            "$env/bin/python" -m pip install --upgrade pip
            "$env/bin/python" -m pip install pytest pytest-xdist
          done
          "$RUNNER_TEMP/clean-wheel-env/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/clean-sdist-env/bin/python" -m pip install dist/*.tar.gz
          "$RUNNER_TEMP/clean-wheel-env/bin/python" -m pip check
          "$RUNNER_TEMP/clean-sdist-env/bin/python" -m pip check
      - name: Import smoke + full public-module sweep from each clean artifact
        # Run as a script (its dir, not the repo root, is on sys.path) so the source tree cannot shadow
        # the installed package; the script asserts it is importing the site-packages wheel.
        run: |
          "$RUNNER_TEMP/clean-wheel-env/bin/python" scripts/import_sweep.py
          "$RUNNER_TEMP/clean-sdist-env/bin/python" scripts/import_sweep.py
      - name: Run stable, serialization, and composed-fit behavior from each artifact
        run: |
          mkdir "$RUNNER_TEMP/artifact-tests"
          cp \
            mixle/tests/invariant_catalog_test.py \
            mixle/tests/serialization_audit_contracts_test.py \
            mixle/tests/serialization_test.py \
            mixle/tests/smoke_test.py \
            "$RUNNER_TEMP/artifact-tests/"
          cd "$RUNNER_TEMP/artifact-tests"
          for kind in wheel sdist; do
            env="$RUNNER_TEMP/clean-$kind-env"
            "$env/bin/python" -c \
              'import pathlib,mixle; p=pathlib.Path(mixle.__file__).resolve(); assert "site-packages" in p.parts, p'
            "$env/bin/python" -m pytest -q -n 0 -m "" \
              invariant_catalog_test.py serialization_audit_contracts_test.py \
              serialization_test.py smoke_test.py \
              --junitxml="clean-$kind-behavior.xml"
            "$env/bin/python" "$GITHUB_WORKSPACE/scripts/verify_installed_schema_manifest.py" \
              --manifest "$GITHUB_WORKSPACE/manifests/serialization_schema_manifest.json" \
              --profile base
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: clean-wheel-behavior-${{ github.sha }}
          path: ${{ runner.temp }}/artifact-tests/clean-*-behavior.xml
          if-no-files-found: error
          retention-days: 90

  optional:
    name: optional extras / py3.12
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install optional test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,numba,torch,umap,jax,scientist,examples]"
      - name: Run optional tests
        run: |
          python scripts/run_test_tier.py \
            --tier optional \
            --candidate-sha "$GITHUB_SHA" \
            --budget-seconds 1800 \
            --receipt optional-py3.12.json \
            -- -n auto \
            --ignore=mixle/tests/scientist_test.py \
            --ignore=mixle/tests/quotient_leaf_test.py
      - name: Require assembled scientist execution on pinned assets
        run: |
          python scripts/run_required_pytest.py \
            --candidate-sha "$GITHUB_SHA" \
            --receipt scientist-required-receipt.json \
            -- mixle/tests/scientist_test.py -q -n 0 -m ""
      - name: Require quotient-leaf execution on pinned CIFAR-10
        run: |
          python scripts/run_required_pytest.py \
            --candidate-sha "$GITHUB_SHA" \
            --receipt quotient-required-receipt.json \
            -- mixle/tests/quotient_leaf_test.py -q -n 0 -m ""
      - name: Reject full-profile serialization removals
        run: |
          python scripts/verify_installed_schema_manifest.py \
            --manifest manifests/serialization_schema_manifest.json \
            --profile full
      - name: Run gated two-rank torchrun smoke
        # -m "" overrides the default `-m fast` addopts; the torchrun tests aren't `fast`, so without this
        # the selection is empty and pytest exits 5 ("no tests collected"), failing the job.
        run: MIXLE_RUN_TORCHRUN_SMOKE=1 python -m pytest mixle/tests/torchrun_encoded_data_test.py mixle/tests/torch_neural_test.py -q -m ""
      - name: Run scikit-learn GMM fitted-parameter parity (Q5.5)
        # scikit-learn is an external reference (not a mixle runtime dependency); the test importorskips
        # it, so this step is the one place it is installed and actually exercised as a gate.
        run: |
          python -m pip install scikit-learn
          python -m pytest mixle/tests/sklearn_gmm_parity_test.py -q -m ""
      - name: Run the temporal real-data flagship smoke (sunspots HMM vs hmmlearn, F10.2)
        # This required-evidence wrapper treats every skip as failure and emits an exact-SHA dependency receipt.
        run: |
          python -m pip install hmmlearn
          python scripts/run_required_pytest.py \
            --candidate-sha "$GITHUB_SHA" \
            --receipt sunspots-required-receipt.json \
            -- mixle/tests/flagship_temporal_sunspots_smoke_test.py -q -n 0 -m ""
      - name: Run the heterogeneous real-data flagship smoke (Adult, F10.1)
        # A missing dataset or dependency is a failed required receipt, never a green skip.
        run: |
          python -m pip install datasets
          python scripts/run_required_pytest.py \
            --candidate-sha "$GITHUB_SHA" \
            --receipt adult-required-receipt.json \
            -- mixle/tests/flagship_heterogeneous_adult_smoke_test.py -q -n 0 -m ""
      - name: Exercise the dask distributed backend (worklist D8.3)
        # The dask encoded-data backend has tests that SKIP everywhere else because dask is not installed.
        # Install it and run them, so at least one distributed backend is genuinely exercised in CI (E2),
        # not just documented. dask is pip-only (no Java/cluster), so it is the cheapest to gate here.
        run: |
          python -m pip install "dask>=2023.5.0" "distributed>=2023.5.0"
          python -m pytest mixle/tests/dask_encoded_data_test.py -q -m ""
      - name: Install the Banking77 flagship dataset dependency
        run: |
          python -m pip install datasets
          python -m pip install -r release-checklists/0.8.0-repro-requirements.txt
      - name: Run the Banking77 real-data flagship smoke
        # The one flagship on real public data (F10.4): the bundle runner verifies the immutable source
        # bytes, bounded configuration, strict JSON receipt, and expected result contract.
        run: python scripts/run_repro_entry.py --entry flagship-banking77-cascade > banking77-reproduction-receipt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: banking77-reproduction-receipt
          path: |
            optional-py3.12.json
            banking77-reproduction-receipt.json
            sunspots-required-receipt.json
            adult-required-receipt.json
            scientist-required-receipt.json
            quotient-required-receipt.json
          if-no-files-found: error
          retention-days: 90

  numerical:
    name: numerical / repeated-seed stress
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install numerical test harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,highprec]"
      - name: Run the hard-budget numerical tier
        run: |
          python scripts/run_test_tier.py \
            --tier numerical \
            --candidate-sha "$GITHUB_SHA" \
            --budget-seconds 1800 \
            --receipt numerical.json \
            -- -n auto
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: numerical-tier-${{ github.sha }}
          path: numerical.json
          if-no-files-found: error
          retention-days: 90

  hardware:
    name: hardware / MPI and torchrun
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install MPI, torchrun, and the test harness
        run: |
          sudo apt-get update
          sudo apt-get install -y libopenmpi-dev openmpi-bin
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,mpi,torch]"
      - name: Run the hard-budget hardware tier
        env:
          MIXLE_RUN_TORCHRUN_SMOKE: "1"
        run: |
          python scripts/run_test_tier.py \
            --tier hardware \
            --candidate-sha "$GITHUB_SHA" \
            --budget-seconds 1200 \
            --receipt hardware.json \
            -- -n 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hardware-tier-${{ github.sha }}
          path: hardware.json
          if-no-files-found: error
          retention-days: 90
