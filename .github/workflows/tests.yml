name: Tests

on:
  # Main and the active release branch run exact-tip CI. Pull-request branches are covered by the
  # pull_request event, so ordinary work branches do not trigger duplicate runs.
  push:
    branches: [main, release/0.8.0]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * 1"

# Cancel superseded runs (e.g. rapid pushes to the same PR / branch) instead of piling them up.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  decision-reviews:
    name: release decisions / accepted review
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/release/0.8.0')
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Block release sign-off on pending decision reviews
        run: python scripts/verify_decision_reviews.py release-checklists/0.8.0-decisions.md

  smoke:
    name: smoke / collection-light
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install base smoke harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run explicit smoke manifest
        run: python scripts/run_smoke.py --out smoke-receipt.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: smoke-receipt
          path: smoke-receipt.json
          if-no-files-found: error

  lint:
    name: lint (ruff enforced, mypy advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install lint tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[lint]"
      # ruff is enforced: the tree is formatted and lint-clean under the rules in pyproject.toml.
      - name: ruff format --check
        run: ruff format --check mixle
      - name: ruff check
        run: ruff check mixle
      - name: Parse and validate release workflows
        run: python scripts/check_workflows.py
      # Y4.4 architecture contracts ([tool.importlinter] in pyproject.toml): experimental is never a
      # dependency of the stable core; distribution kernels / engines carry no direct orchestration
      # imports. Static graph analysis (grimp) -- imports nothing, so no optional extras needed here.
      - name: lint-imports (architecture contracts)
        run: lint-imports
      # A curated typed-core is checked strictly and BLOCKING (worklist Y4.1): these modules are fully
      # annotated and clean under disallow_untyped_defs (see the [[tool.mypy.overrides]] typed-core list in
      # pyproject.toml). --follow-imports=skip keeps the check to these modules' own annotations so a
      # dependency's or an untyped sibling's errors cannot leak in. The list grows as more modules qualify.
      - name: mypy (typed core, blocking)
        run: |
          mypy --follow-imports=skip mixle/scorecard.py mixle/spend.py mixle/registry.py \
            mixle/system/__init__.py mixle/system/core.py mixle/system/spend.py \
            mixle/system/registry.py mixle/system/scorecard.py
      # The whole-tree mypy stays advisory until the rest of the type-checking backlog is addressed.
      - name: mypy (whole tree, advisory)
        continue-on-error: true
        run: mypy

  fast:
    name: core / py${{ matrix.python-version }} / attempt ${{ matrix.attempt }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
        attempt: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # `highprec` (mpmath) is installed alongside `test` here so vmf_test.py / kent_test.py /
      # lkj_test.py / bingham_test.py's exact-normalizer checks keep actually running (not skipping) now
      # that mpmath is an optional extra rather than a base dependency (worklist P2.2).
      - name: Install package and test harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,highprec]"
      - name: "Run the hard-budget core tier (DIAGNOSTIC - verbose, memory/disk sampler)"
        # -v makes xdist print "[gwN] [ 13%] FAILED <nodeid>" the moment a test fails, so the name
        # survives a runner kill that never lets the end-of-run summary print. The sampler logs
        # memory and disk every 10s so the kill can be attributed to exhaustion of one or the other.
        run: |
          ( while true; do
              echo "SAMPLE $(date -u +%H:%M:%S) $(free -m | awk '/Mem:/{printf "mem used %s/%s MB avail %s", $3, $2, $7}') $(free -m | awk '/Swap:/{printf "swap %s/%s", $3, $2}') $(df -m / | awk 'NR==2{printf "disk free %s MB", $4}') $(df -m /tmp | awk 'NR==2{printf "tmp free %s MB", $4}') procs $(ps -e --no-headers | wc -l)"
              sleep 10
            done ) &
          SAMPLER=$!
          set +e
          python scripts/run_test_tier.py \
            --tier core \
            --candidate-sha "$GITHUB_SHA" \
            --budget-seconds 1500 \
            --receipt "core-py${{ matrix.python-version }}-${{ matrix.attempt }}.json" \
            -- -n auto -v
          rc=$?
          kill $SAMPLER
          echo "FINAL $(free -m | awk '/Mem:/{printf "mem used %s/%s", $3, $2}') $(df -m / | awk 'NR==2{printf "disk free %s MB", $4}')"
          ps -eo pid,ppid,rss,etime,comm --sort=-rss | head -15
          exit $rc
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: core-tier-py${{ matrix.python-version }}-${{ matrix.attempt }}
          path: core-py${{ matrix.python-version }}-${{ matrix.attempt }}.json
          if-no-files-found: error
          retention-days: 90

  fast-macos:
    name: core / macOS arm64 / py${{ matrix.python-version }}
    # macOS arm64 is the day-to-day dev platform; this gates it in CI so the "Operating System :: MacOS"
    # classifier and the README's macOS claim are backed by a run, not just ad-hoc local use.
    runs-on: macos-14
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,highprec]"
      - name: Run the hard-budget core tier
        run: |
          python scripts/run_test_tier.py \
            --tier core \
            --candidate-sha "$GITHUB_SHA" \
            --budget-seconds 1500 \
            --receipt "core-macos-py${{ matrix.python-version }}.json" \
            -- -n auto
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: core-macos-tier-py${{ matrix.python-version }}
          path: core-macos-py${{ matrix.python-version }}.json
          if-no-files-found: error
          retention-days: 90

  min-versions:
    name: core / minimum versions
    # Install at the OLDEST declared dependency floors (constraints-min.txt) on the oldest supported
    # Python and run the fast suite, so a floor that is missing an API, unbuildable, or numerically
    # incompatible fails here instead of silently passing on whatever newer version pip resolves.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package at the declared minimum dependency versions
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints-min.txt -e ".[test,highprec]"
          python -c "import numpy, scipy, mpmath; print('numpy', numpy.__version__, 'scipy', scipy.__version__, 'mpmath', mpmath.__version__)"
      - name: Run the hard-budget core tier at the minimum floors
        run: |
          python scripts/run_test_tier.py \
            --tier core \
            --candidate-sha "$GITHUB_SHA" \
            --budget-seconds 1500 \
            --receipt core-minimum-versions.json \
            -- -n auto
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: core-minimum-versions
          path: core-minimum-versions.json
          if-no-files-found: error
          retention-days: 90

  full:
    name: full / py3.12 / shard ${{ matrix.shard }}
    # Runs in parallel with `fast` (no `needs:`); -n auto parallelizes within each runner, and the
    # tier is split across four runners by the deterministic file-hash shard hook in conftest
    # (--num-shards/--shard-id), because the whole tier is ~55 minutes of wall time on one 4-vCPU
    # runner and the release owner set a 15-minute target for the suite. Sharding divides wall time
    # without changing what any test does; the coverage floor moves to the combine job below, since
    # a quarter of the suite cannot meaningfully satisfy a whole-suite floor.
    runs-on: ubuntu-latest
    timeout-minutes: 55
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install package and test harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,highprec]"
      - name: Run full-tier shard with coverage collection
        env:
          COVERAGE_FILE: .coverage.shard${{ matrix.shard }}
        run: |
          python scripts/run_test_tier.py \
            --tier full \
            --candidate-sha "$GITHUB_SHA" \
            --budget-seconds 2700 \
            --receipt full-py3.12-shard${{ matrix.shard }}.json \
            -- -n auto --num-shards 4 --shard-id ${{ matrix.shard }} --cov --cov-report=
      - name: Upload shard coverage and receipt
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: full-shard-${{ matrix.shard }}
          path: |
            .coverage.shard${{ matrix.shard }}
            full-py3.12-shard${{ matrix.shard }}.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  full-coverage:
    name: full / coverage floor
    # --fail-under=45 is a deliberately conservative CATASTROPHIC-REGRESSION floor, not a coverage
    # target. The base install skips every optional backend (torch/numba/spark/dask/jax/...), so line
    # coverage here is a floor of the real number (locally, with the backends installed, the fast suite
    # alone covers ~72%); a threshold set near the true number would misrepresent it and block unrelated
    # PRs. 45% trips only when a whole subsystem's tests vanish -- e.g. a bad merge dropping a test
    # directory. Enforced here, on the COMBINED data of all four shards, because that union is the same
    # measurement the old single job made.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: full
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install coverage
        run: python -m pip install "coverage[toml]"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: full-shard-*
          merge-multiple: true
      - name: Combine shard coverage and enforce the floor
        run: |
          coverage combine .coverage.shard0 .coverage.shard1 .coverage.shard2 .coverage.shard3
          coverage xml -o coverage.xml
          coverage report --fail-under=45
      - name: Upload combined coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: coverage-xml
          path: |
            coverage.xml
            full-py3.12-shard0.json
            full-py3.12-shard1.json
            full-py3.12-shard2.json
            full-py3.12-shard3.json
          if-no-files-found: error
          retention-days: 30

  clean-wheel:
    name: clean-wheel install + import sweep
    # A base install of the BUILT WHEEL (not an editable checkout, no optional extras) must import every
    # public module. An optional dependency imported at a module's top level breaks `import mixle...` for
    # every base-install user -- a regression that shipped in the wheel before (numba, mpi4py).
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Build the wheel and source distribution
        run: |
          python -m pip install --upgrade "pip==26.1.2"
          python -m pip install -r release-checklists/0.8.0-build-requirements.txt
          python -m build --no-isolation --outdir dist
      - name: Install each artifact into its own clean base environment
        run: |
          python -m venv "$RUNNER_TEMP/clean-wheel-env"
          python -m venv "$RUNNER_TEMP/clean-sdist-env"
          for kind in wheel sdist; do
            env="$RUNNER_TEMP/clean-$kind-env"
            "$env/bin/python" -m pip install --upgrade pip
            "$env/bin/python" -m pip install pytest pytest-xdist
          done
          "$RUNNER_TEMP/clean-wheel-env/bin/python" -m pip install dist/*.whl
          "$RUNNER_TEMP/clean-sdist-env/bin/python" -m pip install dist/*.tar.gz
          "$RUNNER_TEMP/clean-wheel-env/bin/python" -m pip check
          "$RUNNER_TEMP/clean-sdist-env/bin/python" -m pip check
      - name: Import smoke + full public-module sweep from each clean artifact
        # Run as a script (its dir, not the repo root, is on sys.path) so the source tree cannot shadow
        # the installed package; the script asserts it is importing the site-packages wheel.
        run: |
          "$RUNNER_TEMP/clean-wheel-env/bin/python" scripts/import_sweep.py
          "$RUNNER_TEMP/clean-sdist-env/bin/python" scripts/import_sweep.py
      - name: Run stable, serialization, and composed-fit behavior from each artifact
        run: |
          mkdir "$RUNNER_TEMP/artifact-tests"
          cp \
            mixle/tests/invariant_catalog_test.py \
            mixle/tests/serialization_audit_contracts_test.py \
            mixle/tests/serialization_test.py \
            mixle/tests/smoke_test.py \
            "$RUNNER_TEMP/artifact-tests/"
          cd "$RUNNER_TEMP/artifact-tests"
          for kind in wheel sdist; do
            env="$RUNNER_TEMP/clean-$kind-env"
            "$env/bin/python" -c \
              'import pathlib,mixle; p=pathlib.Path(mixle.__file__).resolve(); assert "site-packages" in p.parts, p'
            "$env/bin/python" -m pytest -q -n 0 -m "" \
              invariant_catalog_test.py serialization_audit_contracts_test.py \
              serialization_test.py smoke_test.py \
              --junitxml="clean-$kind-behavior.xml"
            "$env/bin/python" "$GITHUB_WORKSPACE/scripts/verify_installed_schema_manifest.py" \
              --manifest "$GITHUB_WORKSPACE/manifests/serialization_schema_manifest.json" \
              --profile base
          done
      - name: Load v0.7 fixtures from each clean artifact
        # The cross-version test resolves its fixtures beside itself and the schema manifest two
        # levels up, so it runs from a reconstructed mixle/tests/ + manifests/ skeleton -- never from
        # the workspace root, where the source tree would shadow the installed package. Before this
        # step existed the v0.7 fixtures were exercised only against the source tree (found by the
        # 0.8.0 gate-receipt audit): the wheel's serialization path had no installed-artifact check.
        run: |
          mkdir -p "$RUNNER_TEMP/xver/mixle/tests/fixtures" "$RUNNER_TEMP/xver/manifests"
          cp mixle/tests/cross_version_fixtures_test.py "$RUNNER_TEMP/xver/mixle/tests/"
          cp -R mixle/tests/fixtures/v0_7_0 "$RUNNER_TEMP/xver/mixle/tests/fixtures/"
          cp manifests/serialization_schema_manifest.json "$RUNNER_TEMP/xver/manifests/"
          cd "$RUNNER_TEMP/xver/mixle/tests"
          for kind in wheel sdist; do
            env="$RUNNER_TEMP/clean-$kind-env"
            "$env/bin/python" -c \
              'import pathlib,mixle; p=pathlib.Path(mixle.__file__).resolve(); assert "site-packages" in p.parts, p'
            "$env/bin/python" -m pytest -q -n 0 -m "" cross_version_fixtures_test.py
          done
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: clean-wheel-behavior-${{ github.sha }}
          path: ${{ runner.temp }}/artifact-tests/clean-*-behavior.xml
          if-no-files-found: error
          retention-days: 90

  optional:
    name: optional extras / py3.12 / shard ${{ matrix.shard }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install optional test extras
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,numba,torch,umap,jax,scientist,examples]"
      - name: Run optional tests
        run: |
          python scripts/run_test_tier.py \
            --tier optional \
            --candidate-sha "$GITHUB_SHA" \
            --budget-seconds 1800 \
            --receipt optional-py3.12-shard${{ matrix.shard }}.json \
            -- -n auto --num-shards 2 --shard-id ${{ matrix.shard }} \
            --ignore=mixle/tests/scientist_test.py
      - name: Require calibrated-serving execution
        if: matrix.shard == 1
        # The calibrated-serving suites are torch-gated and route to this torch-installed lane.
        # Before they carried the torch marker they collected in the torch-less full shards and
        # silently SKIPPED there -- the whole surface executed in no CI job, and a broken
        # accounting identity shipped unnoticed for two review passes. This receipt makes the
        # surface's execution REQUIRED: the runner fails on zero collected tests, any skip, or
        # any failure, so it cannot go silently dark again through a marker, install, or
        # selection drift.
        run: |
          python scripts/run_required_pytest.py \
            --candidate-sha "$GITHUB_SHA" \
            --receipt serving-required-receipt.json \
            -- mixle/tests/task_solve_test.py mixle/tests/task_regress_test.py \
               mixle/tests/task_structured_out_test.py mixle/tests/task_multilabel_test.py \
               -q -n 0 -m ""
      - name: Require assembled scientist execution on pinned assets
        if: matrix.shard == 0
        # Model-weight assets only (CLIP, local LLM, sentence encoder). The dataset-driven scientist
        # tests and the quotient-leaf CIFAR-10 gate were removed with all direct dataset usage
        # (D-0133); this step keeps the model-only surface exercised as a required receipt.
        run: |
          python scripts/run_required_pytest.py \
            --candidate-sha "$GITHUB_SHA" \
            --receipt scientist-required-receipt.json \
            -- mixle/tests/scientist_test.py -q -n 0 -m ""
      - name: Reject full-profile serialization removals
        if: matrix.shard == 0
        run: |
          python scripts/verify_installed_schema_manifest.py \
            --manifest manifests/serialization_schema_manifest.json \
            --profile full
      - name: Run gated two-rank torchrun smoke
        if: matrix.shard == 0
        # -m "" overrides the default `-m fast` addopts; the torchrun tests aren't `fast`, so without this
        # the selection is empty and pytest exits 5 ("no tests collected"), failing the job.
        run: MIXLE_RUN_TORCHRUN_SMOKE=1 python -m pytest mixle/tests/torchrun_encoded_data_test.py mixle/tests/torch_neural_test.py -q -m ""
      - name: Run scikit-learn GMM fitted-parameter parity (Q5.5)
        if: matrix.shard == 0
        # scikit-learn is an external reference (not a mixle runtime dependency); the test importorskips
        # it, so this step is the one place it is installed and actually exercised as a gate.
        run: |
          python -m pip install scikit-learn
          python -m pytest mixle/tests/sklearn_gmm_parity_test.py -q -m ""
      - name: Exercise the dask distributed backend (worklist D8.3)
        if: matrix.shard == 0
        # The dask encoded-data backend has tests that SKIP everywhere else because dask is not installed.
        # Install it and run them, so at least one distributed backend is genuinely exercised in CI (E2),
        # not just documented. dask is pip-only (no Java/cluster), so it is the cheapest to gate here.
        run: |
          python -m pip install "dask>=2023.5.0" "distributed>=2023.5.0"
          python -m pytest mixle/tests/dask_encoded_data_test.py -q -m ""
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: optional-tier-receipt-shard${{ matrix.shard }}
          path: |
            optional-py3.12-shard${{ matrix.shard }}.json
            scientist-required-receipt.json
            serving-required-receipt.json
          if-no-files-found: error
          retention-days: 90

  numerical:
    name: numerical / repeated-seed stress
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install numerical test harness
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,highprec]"
      - name: Run the hard-budget numerical tier
        run: |
          python scripts/run_test_tier.py \
            --tier numerical \
            --candidate-sha "$GITHUB_SHA" \
            --budget-seconds 1800 \
            --receipt numerical.json \
            -- -n auto
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: numerical-tier-${{ github.sha }}
          path: numerical.json
          if-no-files-found: error
          retention-days: 90

  hardware:
    name: hardware / MPI and torchrun
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install MPI, torchrun, and the test harness
        run: |
          # bounded and retried: an apt mirror hang must not consume the lane's whole timeout
          apt_bounded() { for attempt in 1 2 3; do if timeout 240 sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 "$@"; then return 0; fi; echo "apt-get $* attempt $attempt failed or timed out; retrying" >&2; sleep 10; done; return 1; }
          apt_bounded update
          apt_bounded install -y libopenmpi-dev openmpi-bin
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,mpi,torch]"
      - name: Run the hard-budget hardware tier
        env:
          MIXLE_RUN_TORCHRUN_SMOKE: "1"
        run: |
          python scripts/run_test_tier.py \
            --tier hardware \
            --candidate-sha "$GITHUB_SHA" \
            --budget-seconds 1200 \
            --receipt hardware.json \
            -- -n 0
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hardware-tier-${{ github.sha }}
          path: hardware.json
          if-no-files-found: error
          retention-days: 90

  release-check-evidence:
    # Produces the ONE record that binds a review candidate to approved checks, and attests it.
    # metadata/release-check-evidence.json is only ever written by scripts/verify_required_checks.py
    # over the commit's real check runs, only when every check in .github/release-required-checks.txt
    # is completed/success -- and shape alone is not approval (systems review pass 5, SYS5-01), so
    # the record is signed through this workflow's OIDC identity (actions/attest -> Sigstore) and the
    # receipt resolver verifies that attestation, bound to this repository, this workflow file, and
    # the commit it ran at. It lives here rather than in its own file because workflow_dispatch needs
    # the workflow file on the default branch, and tests.yml is there. Dispatch-only, and it needs
    # every other job green: on push it is skipped. publish.yml does the same in its own
    # verify-candidate step, signed as publish.yml.
    name: release check evidence / attested record
    if: github.event_name == 'workflow_dispatch'
    needs:
      - decision-reviews
      - smoke
      - lint
      - fast
      - fast-macos
      - min-versions
      - full
      - full-coverage
      - clean-wheel
      - optional
      - numerical
      - hardware
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Generate the record for the exact tip (fails closed)
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SHA"
          mkdir -p evidence
          gh api --paginate --slurp "repos/$REPOSITORY/commits/$SHA/check-runs?per_page=100" > evidence/check-runs.json
          python scripts/verify_required_checks.py \
            --required .github/release-required-checks.txt \
            --input evidence/check-runs.json \
            --sha "$SHA" \
            --repository "$REPOSITORY" > evidence/release-check-evidence.json
      - id: attest
        name: Attest the record through this workflow's identity
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: evidence/release-check-evidence.json
          predicate-type: https://github.com/gmboquet/mixle/release-check-evidence/v1
          predicate: '{"commit": "${{ github.sha }}", "phase": "review-candidate"}'
          show-summary: false
      - name: Retain the bundle and verify it exactly as the receipt resolver will
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: |
          set -euo pipefail
          cp "$BUNDLE" evidence/release-check-evidence.sigstore.json
          gh attestation verify evidence/release-check-evidence.json \
            --bundle evidence/release-check-evidence.sigstore.json \
            --repo "$REPOSITORY" \
            --cert-identity-regex "^https://github\\.com/$REPOSITORY/\\.github/workflows/tests\\.yml@" \
            --cert-oidc-issuer https://token.actions.githubusercontent.com \
            --source-digest "$SHA" \
            --predicate-type https://github.com/gmboquet/mixle/release-check-evidence/v1 \
            --deny-self-hosted-runners \
            --format json > /dev/null
          sha256sum evidence/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          # attempt in the name: a rerun of just this job yields a SECOND attested record (a
          # different run invocation) without a full re-dispatch, and artifact names must be
          # unique within a run
          name: release-check-evidence-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: evidence/
          if-no-files-found: error
          retention-days: 90
