[build-system]
requires = ["setuptools==83.0.0", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
# PyPI distribution name; the import package is `mixle` (cf. scikit-learn -> sklearn).
name = "mixle"
version = "0.8.0"
description = "Composable statistical inference, automatic modeling, and evidence-aware scientific workflows."
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Grant Boquet", email = "grant.boquet@gmail.com" }]
keywords = [
    "machine learning",
    "density estimation",
    "statistics",
    "probabilistic inference",
    "scientific computing",
    "heterogeneous data",
]
classifiers = [
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    # CI (.github/workflows/tests.yml) gates Linux x86_64 and macOS arm64 (the `fast` and `fast-macos`
    # jobs); both are tested on every PR. Windows is untested and unclaimed.
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
# Base install covers all distributions and local (numpy) estimation; acceleration,
# distribution, and embedding back-ends are opt-in extras (see [project.optional-dependencies]).
# Python 3.11 and 3.12 are the complete supported interpreter range for 0.8.0. Later interpreters must
# first be added to the hosted matrix; the upper bound prevents an unvalidated future interpreter from
# being presented by installers as supported. Lower bounds are the OLDEST releases the full fast suite
# is verified green against, not aspirational
# minimums: numpy < 2.1 hits genuine product IndexError bugs (cross_validation / robust covariance) and
# numpy < 2.4 makes the t-SNE/embedding layout version-fragile; scipy < 1.11.2 has no Python 3.12 wheel
# and scipy < 1.13 loses von Mises / wrapped Cauchy normalization precision (scipy >=1.16 also pairs
# with numpy 2.4). These floors move together and are enforced by the minimum-version jobs. Upper
# bounds prevent an unreviewed future compatibility line from entering an old release.
# mpmath is deliberately NOT here: its one non-test consumer (mixle.engines.highprec) already treats it
# as an optional fallback behind gmpy2 (try/except ImportError, degrading to `_BACKEND=None`), so forcing
# it into every install contradicted the base-install optional-dependency convention this project
# otherwise enforces (worklist P2.2; mixle/tests/optional_import_guard_test.py). See the `highprec` extra
# below -- `mpmath>=1.3` moved there with its floor unchanged.
dependencies = [
    # 2.4.1 rather than 2.4: 2.4.0 is yanked upstream and is no longer an installable floor for a
    # resolver, so declaring it made the minimum-version lane depend on a withdrawn release.
    "numpy>=2.4.1,<3",
    "scipy>=1.16,<2",
]

[project.optional-dependencies]
# Extras are opt-in; lower bounds are conservative floors and upper bounds stop unreviewed future
# compatibility lines. The exact candidate graph and each declared floor are hosted gates. numba >= 0.59 is the first
# series with 3.10-3.12 wheels and the njit features the kernels use. tbb is numba's optional
# parallel=True threading backend (several kernels use parallel=True); numba falls back to its own
# built-in "workqueue" threading layer without it, so it's a performance extra, not a hard requirement
# -- and it must stay platform-gated: Intel TBB ships no arm64 (Apple Silicon) wheels, so an
# unconditional floor here makes `pip install mixle[numba]` uninstallable on that platform.
numba = ["numba>=0.64,<1", "tbb>=2021.6,<2022; platform_machine == 'x86_64'"]
# The read-side DataFrame data adapter duck-types and never imports pandas; the write-side result
# egress (ParameterPosterior/CalibrationReport/MarkovChainLatentPosterior .to_dataframe/.to_parquet)
# constructs a real pandas.DataFrame, so it needs the library itself (mixle.utils.optional_deps).
# Either way it stays optional so the base install stays lean.
pandas = ["pandas>=2.2.2,<4"]
# data-layer connectors (mixle.data.sources) -- each lazy + optional.
arrow = ["pyarrow>=16,<26"]
sql = ["sqlalchemy>=2.0,<3"]
mongo = ["pymongo>=4.6,<5"]
hadoop = ["pyarrow>=16,<26", "fsspec>=2023.5.0,<2027"]
# lazy N-D array-store connectors (mixle.data.sources.array_source): zarr + HDF5 volumes for
# PatchSampler-style streaming reads. numpy-memmap needs no extra dependency, so it is not listed here.
arrays = ["zarr>=3.0,<4", "h5py>=3.11,<4"]
data = ["pandas>=2.2.2,<4", "pyarrow>=16,<26", "sqlalchemy>=2.0,<3", "pymongo>=4.6,<5", "fsspec>=2023.5.0,<2027", "zarr>=3.0,<4", "h5py>=3.11,<4"]
# graph-grammar models (mixle.stats.sequences.grammar) are the only networkx user; lazy + optional.
grammar = ["networkx>=3.0,<4"]
# GMP-backed (FFT) big-integer multiply for the structural count-DP's large histogram convolutions.
gmpy2 = ["gmpy2>=2.2,<3"]
# mixle.engines.highprec's arbitrary-precision (fp>256) tail: the pure-Python MPFR-equivalent fallback
# used when the faster `gmpy2` extra above is absent. Either extra makes `highprec.available()` True;
# with neither installed the module degrades to `_BACKEND=None` (RuntimeError only if fp>256 is actually
# requested -- the pure-numpy `mixle.engines.extended` path still covers up to fp256 either way).
highprec = ["mpmath>=1.3,<2"]
spark = ["pyspark>=3.4,<5"]
dask = ["dask>=2023.5.0,<2027", "distributed>=2023.5.0,<2027"]
# mixle.utils.parallel.ray_data's "ray" encoded-data backend (map/fold sufficient statistics over a
# Ray cluster, same contract as the spark/dask backends); only ray.remote/ray.put/ray.get/ray.init are
# used, all stable since early 2.x.
ray = ["ray>=2.31,<3"]
# mixle.utils.parallel.lightning_data's "lightning" encoded-data backend (mini-batch iteration via a
# lightning.pytorch.LightningDataModule + DataLoader, driving stochastic/mini-batch EM).
lightning = ["lightning>=2.4,<3"]
# safetensors is the companion of torch here: torch TaskModel artifacts persist their weights through
# safetensors.torch.save_model (see mixle/task/artifact.py), so a torch install needs it to save/load.
torch = ["torch>=2.4,<3", "safetensors>=0.4.1,<1"]
# the assembled laptop scientist (mixle.scientist): real open-weight encoders + a local LLM as typed
# leaves. Weights load from the local HF cache; nothing is downloaded at import.
scientist = ["torch>=2.4,<3", "safetensors>=0.4.1,<1", "transformers>=4.40,<6", "sentence-transformers>=3.0,<6"]
# Documentation build (Sphinx site): the Furo theme + MyST markdown; autodoc mocks the heavy back-ends.
# sphinx-polyversion remains only for the legacy development preview in docs/poly.py. Release docs are
# built once during publication and assembled from authenticated archives rather than rebuilt by it.
docs = ["sphinx>=7,<10", "furo<2027", "myst-parser>=2,<6", "sphinx-polyversion>=2.0,<3"]
# JaxEngine (XLA arrays, functional autograd) + the NumPyro NUTS sampler backend (how="nuts", backend="jax").
jax = ["jax>=0.4.38,<1", "numpyro>=0.16,<1"]
mpi = ["mpi4py>=4.1,<5"]
umap = ["umap-learn>=0.5.6,<1"]
sympy = ["sympy>=1.12,<2"]
# to_sage symbolic export. Full SageMath is not pip-installable; passagemath is its modular,
# wheel-distributed fork (the symbolic subset suffices -- it provides sage.all__sagemath_symbolics).
sage = ["passagemath-symbolics>=10.5.49,<11"]
# mongomock is a test-only, in-memory pymongo work-alike (mixle.data.sources.mongo_source itself never
# imports it): mongo_source_test.py points MongoCursorSource's real `pymongo.MongoClient` reference at
# it via monkeypatching, the direct Mongo analogue of the SQL connector's tests using a disposable
# sqlite file -- a real, fast, dependency-light local target instead of a genuine network round trip
# (MXR-080-1666). No local mongod/Docker is assumed anywhere in this suite.
test = ["pytest>=8", "pytest-xdist>=3.0", "pytest-cov>=5.0", "mongomock>=4.3"]
# The optional Cython popcount/LNS kernels (mixle/engines/*.pyx) compile on demand via
# mixle.engines.build_kernels.compile_*_kernels() into an isolated per-ABI cache directory (never the
# installed package, which may be read-only) using portable, per-architecture compiler flags -- not
# `-mcpu=native`/`-march=native` (MXR-080-0155): that flag is rejected outright by clang/gcc on x86_64
# and, even where accepted, ties the binary to the exact build machine's CPU. This extra pulls the build
# toolchain; the .pyx sources themselves ship in every sdist/wheel (MANIFEST.in +
# [tool.setuptools.package-data]).
kernels = ["Cython>=3.0,<4", "setuptools>=68,<84"]
# External comparison packages used by shipped examples. They are isolated from the core/test extras
# because the examples explicitly compare against third-party implementations.
examples = ["torch>=2.4,<3", "safetensors>=0.4.1,<1", "transformers>=4.40,<6", "peft>=0.11,<1", "scikit-learn>=1.4.2,<2", "pomegranate>=1.0,<2", "hmmlearn>=0.3,<1"]
# ruff is pinned: a newer release could add rules and break the blocking lint check unexpectedly.
# import-linter is floored, not pinned: its contracts are fully self-defined in [tool.importlinter],
# so new releases cannot add surprise rules the way a linter's default rule set can.
lint = ["ruff==0.15.20", "mypy>=1.0", "import-linter>=2", "PyYAML==6.0.3"]
# Exact union of runtime-feature extras above. ``scripts/check_optional_extras.py`` rejects drift.
# Development-only ``docs``, ``test``, and ``lint`` are intentionally excluded.
all = [
    "Cython>=3.0,<4",
    "dask>=2023.5.0,<2027",
    "distributed>=2023.5.0,<2027",
    "fsspec>=2023.5.0,<2027",
    "gmpy2>=2.2,<3",
    "h5py>=3.11,<4",
    "hmmlearn>=0.3,<1",
    "jax>=0.4.38,<1",
    "lightning>=2.4,<3",
    "mpi4py>=4.1,<5",
    "mpmath>=1.3,<2",
    "networkx>=3.0,<4",
    "numba>=0.64,<1",
    "numpyro>=0.16,<1",
    "pandas>=2.2.2,<4",
    "passagemath-symbolics>=10.5.49,<11",
    "peft>=0.11,<1",
    "pomegranate>=1.0,<2",
    "pyarrow>=16,<26",
    "pymongo>=4.6,<5",
    "pyspark>=3.4,<5",
    "ray>=2.31,<3",
    "safetensors>=0.4.1,<1",
    "scikit-learn>=1.4.2,<2",
    "sentence-transformers>=3.0,<6",
    "setuptools>=68,<84",
    "sqlalchemy>=2.0,<3",
    "sympy>=1.12,<2",
    "tbb>=2021.6,<2022; platform_machine == 'x86_64'",
    "torch>=2.4,<3",
    "transformers>=4.40,<6",
    "umap-learn>=0.5.6,<1",
    "zarr>=3.0,<4",
]

[project.urls]
Homepage = "https://github.com/gmboquet/mixle"
Repository = "https://github.com/gmboquet/mixle"

[project.scripts]
mixle-reproduce = "mixle.reproduction:main"

[tool.setuptools]
# Release artifacts do not ship the 400k-line test tree. Runtime data is declared explicitly below;
# MANIFEST.in retains the changelog and generated compatibility manifests in the sdist.
include-package-data = false

[tool.setuptools.packages.find]
include = ["mixle*"]
exclude = ["mixle.tests*"]

[tool.setuptools.package-data]
# Ship the Cython kernel sources so an installed mixle can self-compile them (the `kernels` extra);
# MANIFEST.in carries the same rule for sdists.
"mixle.engines" = ["*.pyx"]
"mixle" = ["fixtures/*.json"]

[tool.importlinter]
# Y4.4 architecture dependency checks. Each contract below is a bar the tree PASSES today, wired as
# a regression gate (the `lint-imports` step of the lint CI job). Scope honesty: the full package
# graph is NOT acyclic at package granularity -- stats<->inference, models<->inference, utils<->engines
# and utils<->stats import each other (function-level lazy imports, deliberate for optional heavy
# dependencies) -- so a whole-tree "layers" contract would be aspirational fiction, and the same
# entanglement makes stats reach task TRANSITIVELY (stats -> inference -> ... -> task), so the two
# kernel contracts forbid DIRECT imports (allow_indirect_imports): the enforceable, regression-gating
# bar today. The experimental contract has no such caveat -- nothing imports experimental, so it is
# enforced over full transitive chains. The ratchet path is to untangle the lazy cycles and then drop
# allow_indirect_imports pair by pair, not to declare layers the code does not have. import-linter's graph (grimp) is static analysis; nothing is imported at lint
# time, so the lint env does not need optional extras.
root_package = "mixle"

[[tool.importlinter.contracts]]
name = "experimental is never a dependency of the stable core (Y4.4)"
type = "forbidden"
source_modules = [
    "mixle.analysis",
    "mixle.data",
    "mixle.doe",
    "mixle.engines",
    "mixle.enumeration",
    "mixle.epistemic",
    "mixle.evolve",
    "mixle.inference",
    "mixle.models",
    "mixle.pool",
    "mixle.ppl",
    "mixle.reason",
    "mixle.represent",
    "mixle.stats",
    "mixle.substrate",
    "mixle.task",
    "mixle.telemetry",
    "mixle.utils",
]
forbidden_modules = ["mixle.experimental"]

[[tool.importlinter.contracts]]
name = "distribution kernels do not depend on orchestration layers (Y4.4)"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["mixle.stats", "mixle.engines"]
forbidden_modules = [
    "mixle.task",
    "mixle.doe",
    "mixle.evolve",
    "mixle.epistemic",
    "mixle.substrate",
    "mixle.ppl",
    "mixle.reason",
    "mixle.pool",
]

[[tool.importlinter.contracts]]
name = "engines are model-agnostic compute (Y4.4)"
type = "forbidden"
allow_indirect_imports = true
source_modules = ["mixle.engines"]
forbidden_modules = [
    "mixle.stats",
    "mixle.models",
    "mixle.inference",
    "mixle.data",
    "mixle.analysis",
    "mixle.enumeration",
]

[tool.pytest.ini_options]
testpaths = ["mixle/tests"]
python_files = ["*_test.py", "test_*.py"]
python_classes = ["*Test", "*TestCase"]
python_functions = ["test_*"]
# Fast + parallel by default: plain `pytest` retains the legacy `fast` alias under `-n auto` for local
# laptop (re-measured 2026-07-11: ~3 min for ~4.8k tests; it had silently regressed to 36+ min before
# the conftest registry retriage). Heavy integration / training / stochastic-recovery tests are tagged
# `slow` in conftest and excluded here; they still run in CI's full gate. Files must NOT self-mark
# `fast` -- the conftest registry is the single triage authority (see pytest_collection_modifyitems).
# A later `-m` on the command line overrides this default, so the CI gates keep working:
#   core correctness run : pytest -m core
#   full correctness run : pytest -m full
#   single file, serial  : pytest path/to/file_test.py -n0 -m ""        (-m "" clears the fast filter)
# --dist loadgroup honors the xdist_group marks conftest puts on minute-scale setUpClass classes
# (the setup runs once per suite instead of once per worker); ungrouped tests keep plain load-balancing.
addopts = "-ra --strict-markers -n auto --dist loadgroup -m fast"
# Warning ownership (T3.3): a DeprecationWarning issued by mixle's OWN code during tests is promoted to an
# error. A deprecation MUST be asserted with pytest.warns / assertWarns (which consumes it before this
# filter sees it); a leaked one is a defect -- a deprecated path used somewhere it should not be, or a
# deprecation nobody is testing. This is scoped to DeprecationWarning from mixle modules on purpose:
#   * third-party warnings (numpy/scipy/torch) stay at the default action -- we do not own them, and
#     erroring on a dependency-internal warning would make an unrelated upgrade break the suite;
#   * mixle's numpy RuntimeWarnings (e.g. log(0) -> -inf in the HMM/sampler math) are expected numerical
#     boundaries, not defects, so they stay at default too;
#   * mixle's own UserWarnings (convergence / fallback notices in ppl, hawkes, context-parallel) are
#     legitimate and not yet all wrapped in pytest.warns -- promoting them needs a per-site classification
#     pass, tracked as follow-up warning-ownership work, not this scoped slice.
# Verified: mixle issues no DeprecationWarning today (no warnings.warn(..., DeprecationWarning) in the
# source), and the slow tests that DID emit mixle-origin warnings under a broader all-category filter
# (RuntimeWarning from log(0), UserWarnings) pass cleanly under this scoped one -- so it gates future
# deprecations rather than flagging existing warnings.
filterwarnings = [
    "default",
    "error::DeprecationWarning:mixle",
    "error::DeprecationWarning:mixle\\..*",
]
markers = [
    "fast: quick correctness tests suitable for every commit.",
    "slow: heavier stochastic, integration, or exhaustive tests for full CI.",
    "optional: tests that require optional extras or external executables.",
    "benchmark: timing-oriented tests; not part of correctness gates.",
    "experimental: tests for mixle.experimental mechanisms without graduation receipts yet (see mixle/experimental/README.md).",
    "legacy: backward-compatibility tests for renamed/aliased APIs; run product-only with -m 'not legacy'.",
    "worklist: domain-vertical acceptance tests for a numbered credibility-worklist item (H/J/K/L/N/IC/E/T series under mixle/tests/test_*.py); run product-only with -m 'not worklist'.",
    "stochastic: tests whose assertions depend on random sampling.",
    "integration: end-to-end workflow tests across multiple modules.",
    "distribution: distribution interface, density, sampler, estimator, and encoder tests.",
    "bayes: Bayesian (conjugate/variational) distribution and fit/streaming tests.",
    "automatic: automatic model detection/profiling tests.",
    "ppl: probabilistic-programming dialect (free/joint/fit) tests.",
    "doe: design-of-experiments, Bayesian-optimization, and sensitivity-analysis tests.",
    "enumeration: support enumeration and quantized-index tests.",
    "fisher: Fisher information/view tests.",
    "hvis: model-based embedding (t-SNE / UMAP / ...) affinity and embedding tests.",
    "graph: random graph and graph-structured model tests.",
    "knowledge_graph: knowledge graph model tests.",
    "pomdp: partially observable Markov decision process tests.",
    "causal: conditional dependence and causal structure learning tests.",
    "grammar: grammar learning and PCFG tests.",
    "kernel: fused kernel/compiled path tests.",
    "em: expectation-maximization strategy tests.",
    "torch: torch engine tests.",
    "jax: JAX engine / NumPyro backend tests.",
    "numba: numba-accelerated path tests.",
    "mpi: MPI backend tests.",
    "dask: dask.distributed backend tests.",
    "ray: Ray backend tests.",
    "spark: Spark backend tests.",
    "torchrun: torch.distributed/torchrun backend tests.",
    "parallel: multiprocessing or distributed backend tests.",
    "planner: resource and placement planning tests.",
    "serialization: JSON serialization tests.",
    "hmm: HMM, segmental HMM, tree HMM, and lookback HMM tests.",
    "pcfg: grammar and PCFG tests.",
    "latent: mixture, DPM, LDA, LLDA, and hidden-association tests.",
    # --- T3.1 test tiers (purpose + time budget; see docs/test-tiers.rst) ---
    "smoke: import, public-API, and critical-fit-path checks; budget <=30 s local / <=60 s CI.",
    "core: stable base-install correctness; budget <=25 min per Python CI job.",
    "full: all non-optional correctness incl. slow tests; budget <=90 min.",
    "numerical: repeated-seed and numerical-stress tests; budget <=30 min, scheduled/manual.",
    "hardware: real MPI/torchrun multi-process receipts; budget <=20 min, scheduled/manual.",
]

[tool.coverage.run]
source = ["mixle"]
omit = ["mixle/tests/*"]
# branch coverage catches an untested if/else arm that line coverage alone would miss.
branch = true

[tool.coverage.report]
# Lines that are structurally unreachable in a coverage run (defensive asserts, TYPE_CHECKING blocks,
# abstract-method bodies) are excluded rather than counted against the threshold.
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "^\\s*\\.\\.\\.\\s*$",
]
skip_covered = false
show_missing = true

[tool.ruff]
line-length = 120
target-version = "py311"
# Demo scripts under examples/ are illustrative and not held to library lint rules.
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "BLE"]
ignore = [
    "F403", # `from mixle.engines.arithmetic import *` is an intentional dispatch namespace
    "F405", #   (mixle.engines.arithmetic defines __all__); the star is deliberate, not accidental.
    "E501", # line length is governed by the formatter, not flagged by the linter.
    "B008", # immutable sentinel instances as defaults (e.g. NullDistribution()) are intentional.
    # The rules below are deliberately not enforced over this scientific codebase; they are
    # either stylistic or risky to retrofit in bulk. Revisit case-by-case rather than globally.
    "UP031", # printf-style `%` formatting is valid and pervasive; mechanical f-string rewrites risk behavior changes.
    "B905",  # `zip(..., strict=...)` retrofit changes runtime behavior (raises on length mismatch).
    "B904",  # explicit `raise ... from` exception chaining; cosmetic here.
    "B007",  # unused loop control variables are often intentional in numeric loops.
    "E741",  # single-letter names (l, I, O) are idiomatic for indices/matrices in the math code.
    "E731",  # lambda assignment is used deliberately for small local closures.
    "E402",  # several modules do deliberate late/conditional (optional-backend) imports.
    "F841",  # unused locals are frequently intermediate scientific results kept for clarity.
]

[tool.mypy]
# Matches the newest interpreter CI's lint job runs (setup-python pins 3.12), not the package's own
# `requires-python` floor: numpy's bundled stubs use PEP 695 `type` alias syntax mypy can only parse
# at python_version >= 3.12, regardless of what mixle's own code targets. The real 3.11-floor
# compatibility check is the `min-versions` CI job's actual interpreter run, not this syntax target.
python_version = "3.12"
files = ["mixle"]
# Strictness is intentionally relaxed for a large, partially-typed scientific codebase;
# tighten incrementally (e.g. per-module overrides) as annotations are completed.
ignore_missing_imports = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "mixle.tests.*"
ignore_errors = true

# Typed-core (worklist Y4.1): these modules are fully annotated and clean under strict mypy
# (disallow_untyped_defs). They are checked BLOCKING in CI (the "mypy (typed core)" step), unlike the
# advisory whole-tree run. Grow this list as more modules reach the bar -- that is how the type-checked
# core expands without a single boil-the-ocean pass.
[[tool.mypy.overrides]]
module = [
    "mixle.scorecard",
    "mixle.spend",
    "mixle.registry",
    "mixle.system",
    "mixle.system.core",
    "mixle.system.spend",
    "mixle.system.registry",
    "mixle.system.scorecard",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
